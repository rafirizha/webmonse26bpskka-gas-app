  async function init() {
    try {
      if (sessionToken) {

          lastBootstrapSyncAt = nowDateTimeText();
          renderShell();
          logClientTiming("session bootstrap", {
            serverMs: bootstrapReturnedAt - bootstrapStartedAt,
            normalizeMs: bootstrapNormalizedAt - bootstrapReturnedAt,
            renderMs: performance.now() - bootstrapNormalizedAt
          });
        } catch (error) {
          resetToLogin(error);
        }

        return;
      }

      renderLogin(false);
    } catch (error) {
      resetToLogin(error);
    }
  }

  function resetToLogin(error) {
    console.error(error);
    storageRemove("se2026_session_token");
    sessionToken = "";
    lastBootstrapSyncAt = "";

    try {
      renderLogin(false);
    } catch (fallbackError) {
      console.error(fallbackError);
      renderEmergencyLogin();
    }
  }

  function getWebmonLogoSrc() {

  function storageGet(key) {
    try {
      return window.sessionStorage ? window.sessionStorage.getItem(key) || "" : "";
    } catch (error) {
      return "";
    }
  }

  function storageSet(key, value) {
    try {
      if (window.sessionStorage) {
        window.sessionStorage.setItem(key, value);
      }
    } catch (error) {
      // Browser bisa memblokir storage; app tetap jalan tanpa sesi tersimpan.
    }
  }

  function storageRemove(key) {
    try {
      if (window.sessionStorage) {
        window.sessionStorage.removeItem(key);
      }
    } catch (error) {
      // Browser bisa memblokir storage; abaikan supaya login tetap muncul.
    }
  }

  async function handleLogin(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = formValues(form);
    const stopBusy = startBusy("Membuka dashboard...");

    setFormBusy(form, true, "Memeriksa akun...");

    try {
      const loginStartedAt = performance.now();
      const response = await runServer("login", payload);
      const loginReturnedAt = performance.now();
      sessionToken = response.token;
      currentUser = response.user;
      store = normalizeStore(response.data);
      const loginNormalizedAt = performance.now();
      currentView = "dashboard";
      lastBootstrapSyncAt = nowDateTimeText();
      storageSet("se2026_session_token", sessionToken);
      renderShell();
      logClientTiming("login", {
        serverMs: loginReturnedAt - loginStartedAt,
        normalizeMs: loginNormalizedAt - loginReturnedAt,
        renderMs: performance.now() - loginNormalizedAt
      });
      showToast("Login berhasil.");
    } catch (error) {
      showToast(error.message || "Login gagal.", "error");
    } finally {
      setFormBusy(form, false);
      stopBusy();
    }
  }

  function toggleLoginPassword(event) {
    const button = event.currentTarget;
    const input = document.getElementById("password");
    const willShow = input.type === "password";

    input.type = willShow ? "text" : "password";
    button.setAttribute("aria-pressed", String(willShow));
    button.setAttribute("aria-label", willShow ? "Sembunyikan password" : "Tampilkan password");
    input.focus();
  }

    if (!content) {

    destroyChart();

    if (currentView === "dashboard") {
      renderDashboard(content);
    } else if (currentView === "performance") {
      renderPerformance(content);
    } else if (currentView === "weekly") {
      renderWeeklyRecap(content);
    } else if (currentView === "prelist") {
      renderPrelist(content);
    } else if (currentView === "daily") {
      renderDaily(content);
    } else if (currentView === "tasks") {
      renderTasks(content);
    } else if (currentView === "anomali") {
      renderAnomali(content);
    } else if (currentView === "petugas") {
      renderPetugas(content);

  function sourceToggleMarkup(scope, selectedValue) {
    const scopeLabel = scope === "dashboard" ? "Dashboard" : "Kinerja Petugas";
    const options = scope === "performance" ? [
      { value: "field", label: "FIELD REPORT" },
      { value: "fasih", label: "FASIH" },
      { value: "contract", label: "KONTRAK PETUGAS" }
    ] : [
      { value: "field", label: "FIELD REPORT" },
      { value: "fasih", label: "FASIH" }
    ];

    return `
        <section class="source-switch-bar" aria-label="Pilih tampilan ${escapeHtml(scopeLabel)}">
          <div class="source-segmented source-segmented-${escapeHtml(scope)}" role="group" aria-label="Pilihan tampilan">
            ${options.map((item) => `
              <button
                class="source-segment ${selectedValue === item.value ? "active" : ""}"
                type="button"
                data-source-scope="${escapeHtml(scope)}"
                data-source-option="${escapeHtml(item.value)}"
                aria-pressed="${selectedValue === item.value ? "true" : "false"}">
                ${escapeHtml(item.label)}
              </button>
            `).join("")}
          </div>
        </section>
      `;
  }

  function sourceVisibilityClass(selectedValue, expectedValue) {
    return selectedValue === expectedValue ? "" : "hidden";

  function attachSourceSwitchHandlers(content) {

      button.addEventListener("click", () => {

        const option = button.dataset.sourceOption;

        if (scope === "dashboard" && option !== dashboardSourceView) {
          dashboardSourceView = option === "fasih" ? "fasih" : "field";
          renderCurrentView();
          return;

        if (scope === "performance" && option !== performanceSourceView) {
          performanceSourceView = ["field", "fasih", "contract"].includes(option) ? option : "field";

          renderCurrentView();
        }

  function getDailyTargetRowsForPetugas(petugasRows, taskRows, reportRows, dateText) {
    const referenceDate = normalizeDateText(dateText) || todayDateText();
    const dayCount = getDailyTargetDayCount(referenceDate);
    const tasksByPetugas = {};
    const reportTaskMap = {};
    const reportTotalsByPetugas = {};

    taskRows.forEach((task) => {
      if (!tasksByPetugas[task.petugas_id]) {
        tasksByPetugas[task.petugas_id] = [];
      }

      tasksByPetugas[task.petugas_id].push(task);
      Object.keys(getTaskReportIdLookup(task)).forEach((taskId) => {
        reportTaskMap[taskId] = task;
      });
    });

    reportRows.forEach((report) => {
      const task = reportTaskMap[getReportTaskId(report)];

      if (!task) {
        return;
      }

      const reportDate = normalizeDateText(report.tanggal);

      if (!reportDate || reportDate < DAILY_TARGET_START_DATE || reportDate > referenceDate) {
        return;
      }

      if (!reportTotalsByPetugas[task.petugas_id]) {
        reportTotalsByPetugas[task.petugas_id] = {
          realisasiSebelum: 0,
          realisasiHariIni: 0
        };
      }

      if (reportDate === referenceDate) {
        reportTotalsByPetugas[task.petugas_id].realisasiHariIni += getReportMuatanValue(report);
      } else {
        reportTotalsByPetugas[task.petugas_id].realisasiSebelum += getReportMuatanValue(report);
      }
    });

    return petugasRows
      .filter((petugas) => tasksByPetugas[petugas.petugas_id] && tasksByPetugas[petugas.petugas_id].length)
      .map((petugas) => {
        const petugasTasks = tasksByPetugas[petugas.petugas_id] || [];
        const totalAssignedTarget = petugasTasks.reduce((sum, task) => sum + getTaskTargetValue(task), 0);
        const targetKumulatifRaw = DAILY_TARGET_BASE * dayCount;
        const targetKumulatif = totalAssignedTarget > 0
          ? Math.min(totalAssignedTarget, targetKumulatifRaw)
          : targetKumulatifRaw;
        const reportTotals = reportTotalsByPetugas[petugas.petugas_id] || {
          realisasiSebelum: 0,
          realisasiHariIni: 0
        };
        const realisasiSebelum = reportTotals.realisasiSebelum;
        const realisasiHariIni = reportTotals.realisasiHariIni;

        const realisasiKumulatif = realisasiSebelum + realisasiHariIni;

        return {
          petugas_id: petugas.petugas_id,
          petugas: petugas.nama_petugas || "-",
          pml: pmlName(petugas.pml_id),
          wilayah: uniqueValues(petugasTasks.map((task) => task.kecamatan)).map(titleCase).join(", ") || "-",
          targetHariIni: Math.max(targetKumulatif - realisasiKumulatif, 0),
          realisasiHariIni,
          realisasiKumulatif,
          targetKumulatif,
          progress: percentValue(realisasiKumulatif, targetKumulatif)
        };
      })
      .sort((a, b) => b.targetHariIni - a.targetHariIni
        || a.petugas.localeCompare(b.petugas, "id"));
  }

  function getDailyTargetDayCount(dateText) {
    const start = parseDateOnly(DAILY_TARGET_START_DATE);
    const end = parseDateOnly(dateText);

    if (!start || !end || end < start) {
      return 1;
    }

    return Math.floor((end - start) / 86400000) + 1;
  }

  function getFasihReferenceDate(summary) {
    const text = cleanDisplayText(summary && summary.scraped_at);

    if (!text) {
      return todayDateText();
    }

    const isoMatch = text.match(/^(\d{4})-(\d{2})-(\d{2})/);

    if (isoMatch) {
      return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;
    }

    const slashMatch = text.match(/^(\d{2})\/(\d{2})\/(\d{4})/);

    if (slashMatch) {
      return `${slashMatch[3]}-${slashMatch[2]}-${slashMatch[1]}`;
    }

    return todayDateText();
  }

      + asNumber(payload.usaha_non_pertanian_harian)
      + asNumber(payload.usaha_pertanian_harian);

    if (editingReportId) {
      payload.report_id = editingReportId;
      if (await submitMutation(form, "updateDailyReport", payload, "Laporan harian diperbarui.", false)) {
        editingReportId = "";
        renderCurrentView();
      }
    } else {
      await submitMutation(form, "createDailyReport", payload, "Laporan harian tersimpan.");
      const overlay = document.getElementById("dailyModalOverlay");
      if (overlay && !overlay.classList.contains("hidden")) {
        form.reset();
        document.getElementById("dailyProgressPreview").textContent = "0";
      }
    }
  }

      showToast("Laporan tidak ditemukan.", "error");

    currentView = "daily";
    renderCurrentView();

      document.getElementById("dailyPetugas").value = task.petugas_id;
      document.getElementById("dailyTask").dataset.selectedTask = report.task_id;
      updateDailyTaskOptions();

  function updateTaskPetugasOptions(selectedPetugasId) {
    const pmlId = isAdmin()
      ? document.getElementById("taskPml").value
      : currentUser.pml_id;
    const select = document.getElementById("taskPetugas");
    const petugas = store.petugas.filter((item) => !pmlId || item.pml_id === pmlId);

    select.innerHTML = `
        <option value="">Pilih petugas</option>
        ${petugas.map((item) => option(item.petugas_id, petugasLabel(item), selectedPetugasId || select.value)).join("")}
      `;
  }

  function updateDesaOptions(selectedDesa) {
    const kecamatan = document.getElementById("kecamatan").value;
    const desa = DESA_ANAMBAS[kecamatan] || [];

    document.getElementById("desa").innerHTML = `
        <option value="">Pilih desa/kelurahan</option>
        ${desa.map((item) => option(item, item, selectedDesa || "")).join("")}
      `;
  }

  async function handleCreateTask(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = formValues(form);

    if (!isAdmin()) {
      payload.pml_id = currentUser.pml_id;
    }

    if (editingTaskId) {
      payload.task_id = editingTaskId;
      if (await submitMutation(form, "updateTask", payload, "Wilayah kerja diperbarui.", false)) {
        editingTaskId = "";
        renderCurrentView();
      }
    } else {
      await submitMutation(form, "createTask", payload, "Wilayah kerja tersimpan.");
    }
  }

  function editTask(taskId) {
    const task = getTaskById(taskId);

    if (!task) {
      showToast("Wilayah kerja tidak ditemukan.", "error");
      return;
    }

    editingTaskId = taskId;
    currentView = "tasks";
    renderCurrentView();

    if (isAdmin()) {
      document.getElementById("taskPml").value = task.pml_id;
    }

    updateTaskPetugasOptions(task.petugas_id);
    document.getElementById("kecamatan").value = task.kecamatan;
    updateDesaOptions(task.desa);
    document.getElementById("sls").value = task.sls;
    document.getElementById("mulai").value = task.mulai;
    document.getElementById("selesai").value = task.selesai;
    document.getElementById("target").value = task.target;
  }

  function handleTaskModalKeydown(event) {
    if (event.key === "Escape") {
      const overlay = document.getElementById("taskModalOverlay");
      if (overlay && !overlay.classList.contains("hidden")) {
        closeTaskModal();
      }
    }
  }

  function openTaskModal() {
    const overlay = document.getElementById("taskModalOverlay");
    if (!overlay) return;
    overlay.classList.remove("hidden");
    lockPageScroll();
    document.addEventListener("keydown", handleTaskModalKeydown);
    requestAnimationFrame(() => {
      const firstInput = overlay.querySelector("select, input");
      if (firstInput) firstInput.focus();
    });
  }

  function closeTaskModal() {
    const overlay = document.getElementById("taskModalOverlay");
    if (!overlay) return;
    overlay.classList.add("hidden");
    unlockPageScroll();
    document.removeEventListener("keydown", handleTaskModalKeydown);

    // Clear form and edit state when closing
    document.getElementById("taskForm")?.reset();
    if (editingTaskId) {
      editingTaskId = "";
      renderCurrentView();
    }
  }

  function cancelTaskEdit() {
    closeTaskModal();
  }

  function resetTaskFilterState() {
    tablePagination.tasks.page = 1;
    editingTaskId = "";
  }

  function updateAnomaliResults() {
    const rows = getAnomaliRows();
    const filteredRows = getFilteredAnomaliRows(rows);
    const sortedRows = sortRowsByTable(filteredRows, "anomali", getAnomaliSortValue, compareAnomaliRows);
    const paginated = paginatePlainRows(sortedRows, tablePagination.anomali);
    const summary = getAnomaliSummary(filteredRows);
    const summaryElement = document.getElementById("anomaliSummary");
    const tablePanel = document.getElementById("anomaliTablePanel");

    if (summaryElement) {
      summaryElement.innerHTML = renderAnomaliSummary(summary);
    }

    if (tablePanel) {
      tablePanel.innerHTML = renderAnomaliTablePanel(sortedRows, paginated);
      attachStandardSortHandlers(renderCurrentView, tablePanel);
      attachTablePaginationHandlers(renderCurrentView, tablePanel);
      attachAnomaliCompletionHandlers(tablePanel);
    }
  }

    return `
        ${metric("Total Anomali", numberText(summary.total), "info")}

        ${metric("Usaha", numberText(summary.usaha), "amber")}

        ${metric("Selesai", numberText(summary.selesai), "success")}

  function anomaliProgressCard(summary) {
    const progress = percentValue(summary.selesai, summary.total);
    const barWidth = Math.min(progress, 100);

    return `
        <div class="metric anomali-progress-card info">
          <span class="fine">Progress Penyelesaian</span>
          <strong>${percentText(progress)}</strong>
          <div class="anomali-progress-track" aria-hidden="true">
            <div class="anomali-progress-fill" style="width:${barWidth}%"></div>
          </div>
          <span class="muted">${numberText(summary.selesai)} dari ${numberText(summary.total)} selesai</span>
        </div>
      `;
  }

  function getAnomaliRows() {
    const taskIndex = buildAnomaliTaskIndex();

    return (store.anomali || []).map((row) => {
      const idsls = normalizeAnomaliSlsId(row.idsls || row.id_sls || row.idsubsls, row.sub_sls);
      const cleanSlsId = normalizeIdText(cleanWeeklySlsId(idsls));
      const task = taskIndex[cleanSlsId] || {};

      return Object.assign({}, row, {
        anomali_id: row.anomali_id || "",
        idsls,
        cleanSlsId,
        kecamatan: task.kecamatan || row.kecamatan || row.nama_kecamatan || "",
        desa: task.desa || row.desa || row.nama_desa || "",
        sls: task.sls || row.sls || row.nama_sls || "",
        nama_objek: row.nama_objek || row["Nama KRT"] || row["Nama Usaha"] || "",
        petugas_id: task.petugas_id || row.petugas_id || row.id_petugas || "",
        petugas: task.petugas_id ? petugasName(task.petugas_id) : cleanDisplayText(row.petugas || row.nama_petugas || ""),
        pml_id: task.pml_id || row.pml_id || row.id_pml || "",
        pml: task.pml_id ? pmlName(task.pml_id) : cleanDisplayText(row.pml || row.nama_pml || ""),
        korwil: task.korwil || row.korwil || "",
        status: cleanDisplayText(row.status),
        imported : row["imported_at"],
        tindak_lanjut: cleanDisplayText(row.tindak_lanjut || row["Tindak Lanjut"]),
        pjtindaklanjut: cleanDisplayText(row.pjtindaklanjut || row["PJ Tindak Lanjut"] || row["Pj Tindak Lanjut"]),
        assignment_id: cleanDisplayText(row.assignment_id || row["Assignment ID"]),
        mapped: Boolean(task.task_id)
      });
    });
  }

  function buildAnomaliTaskIndex() {
    return store.tasks.reduce((index, task) => {
      const cleanSlsId = normalizeIdText(cleanWeeklySlsId(task.idsubsls));

      if (!cleanSlsId) {
        return index;
      }

      if (!index[cleanSlsId] || shouldUseAsWeeklyRepresentative(index[cleanSlsId], task)) {
        index[cleanSlsId] = task;
      }

      return index;
    }, {});
  }

  function getFilteredAnomaliRows(rows) {
    return rows.filter((row) => {
      const matchKecamatan = !anomaliFilters.kecamatan || row.kecamatan === anomaliFilters.kecamatan;
      const matchDesa = !anomaliFilters.desa || row.desa === anomaliFilters.desa;
      const matchSource = !anomaliFilters.source_type || row.source_type === anomaliFilters.source_type;
      const matchStatus = !anomaliFilters.status || normalizeAnomaliStatus(row.status) === anomaliFilters.status;
      const matchSnapshot = !anomaliFilters.snapshot || row.imported === anomaliFilters.snapshot;

      if (!matchKecamatan || !matchDesa || !matchSource || !matchStatus || !matchSnapshot) {
        return false;
      }

      const keyword = cleanDisplayText(anomaliFilters.keyword).toLowerCase();

      if (!keyword) {
        return true;
      }

      return [
        row.idsls,
        row.source_type,
        row.status,
        row.tindak_lanjut,
        row.pjtindaklanjut,
        row.nama_objek,
        row.assignment_id,
        row.anomali_no,
        row.anomali_title,
        row.kecamatan,
        row.desa,
        row.sls,
        row.petugas,
        row.petugas_id,
        row.pml,
        row.pml_id
      ].some((value) => cleanDisplayText(value).toLowerCase().includes(keyword));
    });
  }

  function getAnomaliSummary(rows) {
    const uniqueSls = {};

    return rows.reduce((summary, row) => {
      const status = normalizeAnomaliStatus(row.status);

      if (row.cleanSlsId || row.idsls) {
        uniqueSls[row.cleanSlsId || row.idsls] = true;
      }

      summary.total += 1;
      summary.uniqueSls = Object.keys(uniqueSls).length;
      if (row.source_type === "keluarga") {
        summary.keluarga += 1;
      } else if (row.source_type === "usaha") {
        summary.usaha += 1;
      }
      if (isAnomaliCompleted(row)) {
        summary.selesai += 1;
      } else {
        summary.belumSelesai += 1;
      }

      if (status === "approve") {
        summary.approve += 1;
      } else if (status === "rejected") {
        summary.rejected += 1;
      } else if (status === "submitted") {
        summary.submitted += 1;
      } else {
        summary.pending += 1;
      }

      return summary;
    }, {
      total: 0,
      uniqueSls: 0,
      keluarga: 0,
      usaha: 0,
      selesai: 0,
      belumSelesai: 0,
      approve: 0,
      rejected: 0,
      submitted: 0,
      pending: 0
    });
  }

  function getAnomaliSortValue(row, key) {
    const values = {
      status: anomaliStatusRank(row.status),
      tindak_lanjut: isAnomaliCompleted(row) ? 1 : 0,
      pjtindaklanjut: row.pjtindaklanjut,
      source_type: anomaliSourceLabel(row.source_type),
      idsls: row.idsls,
      nama_objek: row.nama_objek,
      kecamatan: row.kecamatan,
      desa: row.desa,
      sls: row.sls,
      petugas: row.petugas,
      petugas_id: row.petugas_id,
      pml: row.pml,
      pml_id: row.pml_id,
      anomali_no: row.anomali_no,
      anomali_title: row.anomali_title,
      assignment_id: row.assignment_id,
      imported_at: row.imported_at || row.dashboard_updated_at || ""
    };

    return values[key];
  }

  function compareAnomaliRows(a, b) {
    return String(a.kecamatan || "").localeCompare(String(b.kecamatan || ""), "id")
      || String(a.desa || "").localeCompare(String(b.desa || ""), "id")
      || String(a.idsls || "").localeCompare(String(b.idsls || ""), "id", { numeric: true })
      || String(a.anomali_no || "").localeCompare(String(b.anomali_no || ""), "id", { numeric: true });
  }

  function anomaliStatusOptions(selectedValue) {
    return [
      option("", "Semua status", selectedValue),
      option("approve", "Approve", selectedValue),
      option("submitted", "Submitted", selectedValue),
      option("rejected", "Rejected", selectedValue),
      option("pending", "Belum ada status", selectedValue)
    ].join("");
  }

  function anomaliSnapshotOptions(selectedValue) {
    return [
      option("", "Semua waktu", selectedValue),
      option("2026-06-29 14:32:29", "26-06-2026", selectedValue),
      option("2026-07-02 07:39:28", "02-07-2026", selectedValue),
    ].join("");

  function normalizeAnomaliStatus(value) {
    const text = cleanDisplayText(value).toLowerCase();

    if (!text) return "pending";
    if (text.includes("approved") || text === "approve" || text.includes("disetujui")) return "approve";
    if (text.includes("reject") || text.includes("ditolak")) return "rejected";
    if (text.includes("submit") || text.includes("terkirim")) return "submitted";
    return text;
  }

  function anomaliStatusRank(value) {
    const ranks = {
      rejected: 0,
      submitted: 1,
      pending: 2,
      approve: 3
    };
    const status = normalizeAnomaliStatus(value);

    return ranks[status] === undefined ? 9 : ranks[status];
  }

  function anomaliStatusMarkup(value) {
    const status = normalizeAnomaliStatus(value);
    const labels = {
      approve: "Approve",
      rejected: "Rejected",
      submitted: "Submitted",
      pending: "-"
    };
    const classes = {
      approve: "done",
      rejected: "danger",
      submitted: "warning",
      pending: "open"
    };

    return `<span class="status-pill ${classes[status] || "open"}">${escapeHtml(labels[status] || value || "-")}</span>`;
  }

  function anomaliFollowUpMarkup(row) {
    const completed = isAnomaliCompleted(row);
    const label = completed ? "Selesai" : cleanDisplayText(row.tindak_lanjut) || "Belum Tindak Lanjut";

    return `<span class="status-pill ${completed ? "done" : "warning"}">${escapeHtml(label)}</span>`;
  }

  function isAnomaliCompleted(row) {
    const text = cleanDisplayText(row && row.tindak_lanjut).toLowerCase();
    const resolved = cleanDisplayText(row && row.is_resolved).toUpperCase();

    return resolved === "TRUE" || text === "selesai" || text === "sudah selesai" || text === "done";
  }

  async function toggleAnomaliCompleted(anomaliId, completed, button) {
    if (!anomaliId) {
      showToast("ID anomali tidak valid.", "error");
      return;
    }

    const nextCompleted = !completed;
    const stopBusy = startBusy(nextCompleted ? "Menandai anomali selesai..." : "Membuka status anomali...");
    setButtonBusy(button, true, "Memproses...");

    try {
      const response = await runServer("setAnomaliCompleted", sessionToken, {
        anomali_id: anomaliId,
        completed: nextCompleted
      });

      if (response.data) {
        store = normalizeStore(response.data);
        lastBootstrapSyncAt = nowDateTimeText();
      }

      showToast(nextCompleted ? "Anomali ditandai selesai." : "Status anomali dibuka lagi.");
      renderCurrentView();
    } catch (error) {
      handleError(error);
    } finally {
      setButtonBusy(button, false);
      stopBusy();
    }
  }

  function attachAnomaliCompletionHandlers(rootElement) {
    const root = rootElement || document;

    root.querySelectorAll("[data-complete-anomali]").forEach((button) => {

          button.dataset.completed === "true",

        );
      });
    });
  }

  function anomaliSourceLabel(value) {
    const text = cleanDisplayText(value);

    if (!text) {

    if (text.toLowerCase() === "keluarga") {

    if (text.toLowerCase() === "usaha") {

    return titleCase(text.replace(/[_-]+/g, " "));

  async function parseAnomaliExcelFile(file, sourceType) {
    if (typeof XLSX === "undefined") {
      throw new Error("Library pembaca Excel belum termuat. Refresh halaman lalu coba lagi.");
    }

    const buffer = await readFileAsArrayBuffer(file);
    const workbook = XLSX.read(buffer, {
      type: "array",
      cellDates: false
    });
    const sheetName = workbook.SheetNames[0];

    if (!sheetName) {
      throw new Error(`${file.name} tidak punya sheet.`);
    }

    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {
      defval: "",
      raw: false
    }).map((row) => {
      const normalized = {};

      Object.keys(row).forEach((key) => {
        normalized[cleanDisplayText(key)] = row[key];
      });

      normalized.source_type = sourceType;
      return normalized;
    }).filter((row) => {
      return cleanDisplayText(row["NO SLS"] || row["No SLS"] || row.idsls)
        || cleanDisplayText(row["Nama Anomali"] || row.anomali_title);
    });

    if (!rows.length) {
      throw new Error(`${file.name} tidak punya baris anomali.`);
    }

    const missingHeaders = ["NO SLS", "Nama Anomali"].filter((header) => {
      return !Object.prototype.hasOwnProperty.call(rows[0], header);
    });

    if (missingHeaders.length) {
      throw new Error(`${file.name} belum sesuai template cleaned. Header hilang: ${missingHeaders.join(", ")}.`);
    }

    return {
      fileName: file.name,
      sourceType,
      rows
    };
  }

  async function parseFasihContractExcelFile(file) {
    if (typeof XLSX === "undefined") {
      throw new Error("Library pembaca Excel belum termuat. Refresh halaman lalu coba lagi.");
    }

    const buffer = await readFileAsArrayBuffer(file);
    const workbook = XLSX.read(buffer, {
      type: "array",
      cellDates: false
    });
    const sheetName = workbook.SheetNames[0];

    if (!sheetName) {
      throw new Error(`${file.name} tidak punya sheet.`);
    }

    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {
      defval: "",
      raw: false
    }).map((row) => {
      const normalized = {};

      Object.keys(row).forEach((key) => {
        normalized[cleanDisplayText(key)] = row[key];
      });

      return normalized;
    }).filter((row) => {
      return cleanDisplayText(row.PPL || row.ppl || row.Petugas)
        || cleanDisplayText(row["Email PPL"] || row.email || row.Email);
    });

    if (!rows.length) {
      throw new Error(`${file.name} tidak punya baris kontrak petugas.`);
    }

    const firstRow = rows[0];
    const requiredGroups = [
      ["PPL", "ppl", "Petugas"],
      ["Email PPL", "email_ppl", "Email"],
      ["Total Prelist", "total_prelist", "Total Prelist Assignment"],
      ["Persen Sudah Submit", "persen_sudah_submit", "% Sudah Submit", "Persentase"],
      ["Jumlah Submit", "jumlah_submit", "Jumlah Submit Prelist"]
    ];
    const missingHeaders = requiredGroups.filter((group) => {
      return !group.some((header) => Object.prototype.hasOwnProperty.call(firstRow, header));
    }).map((group) => group[0]);

    if (missingHeaders.length) {
      throw new Error(`${file.name} belum sesuai template kontrak. Header hilang: ${missingHeaders.join(", ")}.`);
    }

    return {
      fileName: file.name,
      rows
    };
  }

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = () => reject(new Error("File CSV gagal dibaca."));
      reader.readAsText(file);
    });
  }

  function readFileAsArrayBuffer(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("File Excel gagal dibaca."));
      reader.readAsArrayBuffer(file);
    });
  }

  function parseFasihCsvText(text) {
    const lines = String(text || "")
      .replace(/^\uFEFF/, "")
      .split(/\r?\n/)
      .map((line) => line.replace(/;+$/g, ""))
      .filter((line) => line.trim() !== "");

    if (lines.length < 2) {
      throw new Error("CSV FASIH minimal berisi header dan satu baris data.");
    }

    const headers = parseCsvLine(lines[0]).map((header) => cleanDisplayText(header));
    const missingHeaders = FASIH_CSV_REQUIRED_HEADERS.filter((header) => !headers.includes(header));

    if (missingHeaders.length) {
      throw new Error(`Header CSV tidak lengkap: ${missingHeaders.join(", ")}`);
    }

    const rows = lines.slice(1).map((line, index) => {
      const values = parseFasihCsvDataLine(line);
      const row = {};

      if (values.length !== headers.length) {
        throw new Error(`Baris data ${index + 2} punya ${values.length} kolom, seharusnya ${headers.length} kolom.`);
      }

      headers.forEach((header, headerIndex) => {
        row[header] = values[headerIndex] === undefined ? "" : values[headerIndex];
      });

      if (!cleanDisplayText(row.SLS_Code)) {
        throw new Error(`Baris data ${index + 2} tidak punya SLS_Code.`);
      }

      return row;
    });

    if (!rows.length) {
      throw new Error("CSV FASIH tidak punya baris data valid.");
    }

    assertUniqueFasihSlsRows(rows);

    return rows;
  }

  function parseFasihCsvDataLine(line) {
    const values = parseCsvLine(line);

    if (values.length === 1 && values[0].includes(",")) {
      return parseCsvLine(normalizeLegacyFasihCsvLine(line));
    }

    return values;
  }

  function normalizeLegacyFasihCsvLine(line) {
    let normalized = String(line || "")
      .replace(/;+$/g, "")
      .trim();

    if (normalized.startsWith('"')) {
      normalized = normalized.slice(1);
    }

    normalized = normalized.replace(/""/g, '"');

    if (normalized.endsWith('"')) {
      normalized = normalized.slice(0, -1);
    }

    return normalized;
  }

  function assertUniqueFasihSlsRows(rows) {
    const seen = {};
    const duplicates = [];

    rows.forEach((row, index) => {
      const slsCode = cleanDisplayText(row.SLS_Code);

      if (!seen[slsCode]) {
        seen[slsCode] = [index + 2];
        return;
      }

      seen[slsCode].push(index + 2);
      duplicates.push(`${slsCode} (baris ${seen[slsCode].join(", ")})`);
    });

    if (duplicates.length) {
      throw new Error(`SLS_Code duplikat ditemukan: ${duplicates.slice(0, 3).join("; ")}. Hapus baris percobaan/duplikat dulu sebelum import.`);
    }
  }

  function parseCsvLine(line) {
    const values = [];
    let current = "";
    let quoted = false;

    for (let index = 0; index < line.length; index++) {
      const char = line[index];
      const next = line[index + 1];

      if (char === '"' && quoted && next === '"') {
        current += '"';
        index++;
      } else if (char === '"') {
        quoted = !quoted;
      } else if (char === "," && !quoted) {
        values.push(current);
        current = "";
      } else {
        current += char;
      }
    }

    values.push(current);
    return values;
  }

        meta: task ? `${pmlName(task.pml_id)} | ${petugasName(task.petugas_id)} | ${task.idsubsls || "-"}` : ""
      };
    }

    if (functionName === "deleteDailyReport") {
      const report = store.reports.find((item) => item.report_id === id);
      const task = report ? getTaskById(report.task_id) : null;
      return {
        label: "laporan harian",
        subject: task ? taskLabel(task) : id,
        meta: report ? `${report.tanggal || "-"} | Muatan ${numberText(getReportMuatanValue(report))}` : ""
      };
    }

    if (functionName === "deletePetugas") {
      const petugas = getPetugasById(id);
      return {
        label: "petugas",
        subject: petugas ? petugas.nama_petugas : id,
        meta: petugas ? pmlName(petugas.pml_id) : ""
      };
    }

    if (functionName === "deletePml") {
      const pml = getPmlById(id);
      return {
        label: "PML",
        subject: pml ? pml.nama_pml : id,
        meta: pml && pml.telepon ? `Telepon ${pml.telepon}` : ""
      };
    }

    if (functionName === "deactivateUser") {
      const user = store.users.find((item) => item.user_id === id);
      return {
        label: "akun",
        subject: user ? user.nama : id,
        meta: user ? `${roleLabel(user.role)} | ${user.username}` : ""
      };
    }

    return {
      label: "data",
      subject: id,
      meta: ""
    };
  }

  function confirmAction(options) {
    return new Promise((resolve) => {
      const existingModal = document.getElementById("confirmModal");

      if (existingModal) {
        existingModal.remove();
      }

      const modal = document.createElement("div");
      modal.id = "confirmModal";
      modal.className = "confirm-modal";
      modal.innerHTML = `
          <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
            <h2 id="confirmTitle">${escapeHtml(options.title || "Konfirmasi")}</h2>
            <p>${escapeHtml(options.message || "Lanjutkan tindakan ini?")}</p>
            ${options.subject ? `
              <div class="confirm-subject">
                <strong>${escapeHtml(options.subject)}</strong>
                ${options.meta ? `<span>${escapeHtml(options.meta)}</span>` : ""}
              </div>
            ` : ""}
            <div class="confirm-actions">
              <button id="confirmCancel" class="btn secondary" type="button">Batal</button>
              <button id="confirmOk" class="btn ${options.danger === false ? "" : "danger"}" type="button">${escapeHtml(options.confirmLabel || "Ya")}</button>
            </div>
          </div>
        `;

      document.body.appendChild(modal);

      const cancelButton = document.getElementById("confirmCancel");
      const confirmButton = document.getElementById("confirmOk");

      function close(result) {
        document.removeEventListener("keydown", handleKeydown);
        modal.remove();
        resolve(result);
      }

      function handleKeydown(event) {
        if (event.key === "Escape") {
          close(false);
        }
      }

      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          close(false);
        }
      });
      cancelButton.addEventListener("click", () => close(false));
      confirmButton.addEventListener("click", () => close(true));
      document.addEventListener("keydown", handleKeydown);
      confirmButton.focus();
    });
  }

  async function refreshData() {
    const button = document.getElementById("refreshButton");
    const stopBusy = startBusy("Menyinkronkan data...");
    setButtonBusy(button, true, "Menyinkronkan...");

    try {
      const refreshStartedAt = performance.now();
      const response = await runServer("getBootstrapData", sessionToken);
      const refreshReturnedAt = performance.now();
      currentUser = response.user;
      store = normalizeStore(response.data);
      const refreshNormalizedAt = performance.now();
      lastBootstrapSyncAt = nowDateTimeText();
      resetWeeklyExportState();
      clearEditingState();
      renderShell();
      logClientTiming("refresh", {
        serverMs: refreshReturnedAt - refreshStartedAt,
        normalizeMs: refreshNormalizedAt - refreshReturnedAt,
        renderMs: performance.now() - refreshNormalizedAt
      });
      showToast("Data tersinkron.");
    } catch (error) {
      handleError(error);
    } finally {
      setButtonBusy(button, false);
      stopBusy();
    }
  }

  async function handleLogout() {
    const button = document.getElementById("logoutButton");
    const stopBusy = startBusy("Keluar dari aplikasi...");
    setButtonBusy(button, true, "Keluar...");

    try {
      await runServer("logout", sessionToken);
    } catch (error) {
      // Logout lokal tetap dilanjutkan.
    } finally {
      stopBusy();
    }

    storageRemove("se2026_session_token");
    sessionToken = "";
    currentUser = null;
    store = emptyStore();
    lastBootstrapSyncAt = "";
    renderLogin(false);
  }

  function getWeeklyRecapRows() {
    const checkpointDate = todayDateText();
    const groups = {};

    store.tasks.forEach((task) => {
      const cleanSlsId = cleanWeeklySlsId(task.idsubsls);

      if (!cleanSlsId) {
        return;
      }

      if (!groups[cleanSlsId]) {
        groups[cleanSlsId] = {
          task,
          idsubsls: cleanSlsId,
          kkValues: emptyCumulativeValues(),
          usahaValues: emptyCumulativeValues(),
          kkPrelist: 0,
          usahaPrelist: 0
        };
      }

      if (shouldUseAsWeeklyRepresentative(groups[cleanSlsId].task, task)) {
        groups[cleanSlsId].task = task;
      }

      groups[cleanSlsId].kkPrelist += asNumber(task.keluarga);
      groups[cleanSlsId].usahaPrelist += getTaskUsahaTotal(task);

      store.reports
        .filter((report) => getTaskReportIdLookup(task)[getReportTaskId(report)])
        .forEach((report) => {
          const dateText = String(report.tanggal || "").slice(0, 10);

          if (!isDateInWeeklyRecapRange(dateText)) {
            return;
          }

          const kk = getReportKeluargaValue(report);
          const usaha = getReportUsahaValue(report);

          WEEKLY_RECAP_PERIODS.forEach((period) => {
            if (isWeeklyRecapPeriodActive(period, checkpointDate) && dateText >= WEEKLY_RECAP_START_DATE && dateText <= period.end) {
              groups[cleanSlsId].kkValues[period.key] += kk;
              groups[cleanSlsId].usahaValues[period.key] += usaha;
            }
          });
        });
    });

    return Object.keys(groups).map((key) => {
      const group = groups[key];
      const task = group.task;
      const totalKk = getLastActiveCumulativeValue(group.kkValues, checkpointDate);
      const totalUsaha = getLastActiveCumulativeValue(group.usahaValues, checkpointDate);

      return {
        task_id: task.task_id,
        kecamatan: task.kecamatan || "",
        desa: task.desa || "",
        idsubsls: group.idsubsls,
        sls: task.sls || "-",
        petugas: petugasName(task.petugas_id),
        kkValues: group.kkValues,
        usahaValues: group.usahaValues,
        totalKk,
        kkPrelist: group.kkPrelist,
        selisihKk: totalKk - group.kkPrelist,
        totalUsaha,
        usahaPrelist: group.usahaPrelist,
        selisihUsaha: totalUsaha - group.usahaPrelist
      };
    }).sort((a, b) => {
      return String(a.idsubsls).localeCompare(String(b.idsubsls), "id")
        || String(a.kecamatan).localeCompare(String(b.kecamatan), "id")
        || String(a.desa).localeCompare(String(b.desa), "id")
        || String(a.sls).localeCompare(String(b.sls), "id")
        || String(a.petugas).localeCompare(String(b.petugas), "id");
    });
  }

  function emptyCumulativeValues() {
    return WEEKLY_RECAP_PERIODS.reduce((result, period) => {
      result[period.key] = isWeeklyRecapPeriodActive(period, todayDateText()) ? 0 : "";
      return result;
    }, {});
  }

  function cleanWeeklySlsId(idsls) {
    return cleanDisplayText(idsls).replace(new RegExp(`${ORGANIC_TASK_SUFFIX}$`, "i"), "");
  }

  function shouldUseAsWeeklyRepresentative(currentTask, nextTask) {
    if (!currentTask) {
      return true;
    }

    return isOrganicTask(currentTask) && !isOrganicTask(nextTask);
  }

  function getLastActiveCumulativeValue(values, checkpointDate) {
    const activePeriods = WEEKLY_RECAP_PERIODS.filter((period) => isWeeklyRecapPeriodActive(period, checkpointDate));
    const lastPeriod = activePeriods[activePeriods.length - 1];

    return lastPeriod ? asNumber(values[lastPeriod.key]) : 0;
  }

  function isWeeklyRecapPeriodActive(period, checkpointDate) {
    return String(checkpointDate || "") >= period.start;
  }

  function checkpointNumberText(value) {
    return value === "" || value === null || value === undefined ? "" : numberText(value);
  }

  function checkpointNumberValue(value) {
    return value === "" || value === null || value === undefined ? null : asNumber(value);
  }

  function todayDateText() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }

  function normalizeDateText(value) {
    const text = cleanDisplayText(value);
    const match = text.match(/^(\d{4})-(\d{2})-(\d{2})/);

    return match ? `${match[1]}-${match[2]}-${match[3]}` : "";
  }

  function parseDateOnly(value) {
    const dateText = normalizeDateText(value);

    if (!dateText) {
      return null;
    }

    const parts = dateText.split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function formatShortDate(value) {
    const dateText = normalizeDateText(value);

    if (!dateText) {
      return "-";
    }

    const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
    const parts = dateText.split("-");

    return `${Number(parts[2])} ${months[Number(parts[1]) - 1] || parts[1]} ${parts[0]}`;
  }

  function isDateInWeeklyRecapRange(dateText) {
    const lastPeriod = WEEKLY_RECAP_PERIODS[WEEKLY_RECAP_PERIODS.length - 1];

    return Boolean(dateText && lastPeriod && dateText >= WEEKLY_RECAP_START_DATE && dateText <= lastPeriod.end);
  }

  function getReportKeluargaValue(report) {
    return firstNumericValue([
      report.keluarga_harian,
      report.keluarga,
      report.kk,
      report.jumlah_keluarga
    ]);
  }

  function getReportUsahaNonPertanianValue(report) {
    return firstNumericValue([
      report.usaha_non_pertanian_harian,
      report.usaha_non_pertanian,
      report.usaha_non_per,
      report.usaha_nonpertanian,
      report.usaha
    ]);
  }

  function getReportUsahaPertanianValue(report) {
    return firstNumericValue([
      report.usaha_pertanian_harian,
      report.usaha_pertanian,
      report.usaha_per,
      report.utp
    ]);
  }

  function getReportMuatanValue(report) {
    if (reportHasStructuredDailyDetails(report)) {
      return getReportKeluargaValue(report)
        + getReportUsahaNonPertanianValue(report)
        + getReportUsahaPertanianValue(report);
    }

    return asNumber(report && report.muatan_harian);
  }

  function getReportUsahaValue(report) {
    if (reportHasStructuredDailyDetails(report)) {
      return getReportUsahaNonPertanianValue(report) + getReportUsahaPertanianValue(report);
    }

    const muatan = asNumber(report && report.muatan_harian);
    const keluarga = getReportKeluargaValue(report);

    return keluarga ? Math.max(muatan - keluarga, 0) : muatan;
  }

  function getTaskUsahaTotal(task) {
    return asNumber(task && task.usaha) + asNumber(task && task.utp);
  }

  async function handleWeeklyDownloadClick(event) {
    event.preventDefault();

    if (weeklyExportState.loading) {
      showToast("File Excel sedang disiapkan. Tunggu sebentar ya.");
      return;
    }

    await prepareWeeklyDownloadLink(true);

  function resetWeeklyExportState() {
    weeklyExportState = {
      loading: false,
      url: "",
      rows: 0
    };
  }

  async function prepareWeeklyDownloadLink(downloadAfterReady) {
    if (weeklyExportState.loading) {
      return;
    }

    const button = document.getElementById("downloadWeeklyRecap");
    const stopBusy = startBusy("Menyiapkan file Excel...");

    setButtonBusy(button, true, "Menyiapkan...");
    weeklyExportState = {
      loading: true,
      url: "",
      rows: 0
    };

    try {
      const response = await runServer("prepareWeeklyProvinceExport", sessionToken);

      weeklyExportState = {
        loading: false,
        url: response.exportUrl,
        rows: response.rows
      };
      updateWeeklyDownloadButton();
      showToast(`Rekap siap diunduh (${numberText(response.rows)} baris).`);

      if (downloadAfterReady) {
        navigateToDownload(response.exportUrl);
      }
    } catch (error) {
      handleError(error);
    } finally {
      weeklyExportState.loading = false;
      setButtonBusy(button, false);
      updateWeeklyDownloadButton();
      stopBusy();
    }
  }

  function updateWeeklyDownloadButton() {
    const button = document.getElementById("downloadWeeklyRecap");

    if (!button) {
      return;
    }

    button.href = weeklyExportState.url || "#";
    button.setAttribute("aria-disabled", weeklyExportState.loading ? "true" : "false");
    button.classList.toggle("is-disabled", weeklyExportState.loading);
    button.innerHTML = `${actionIcon("download")} ${weeklyExportState.loading ? "Menyiapkan..." : "Unduh Excel"}`;
  }

  function getFilteredTasks(filters) {
    const dateTaskIds = filters.tanggal
      ? getTaskReportCache().byDateTaskId[filters.tanggal] || {}
      : null;

    return store.tasks.filter((task) => {
      const matchPml = !filters.pml_id || task.pml_id === filters.pml_id;
      const matchPetugas = !filters.petugas_id || task.petugas_id === filters.petugas_id;
      const matchTaskType = matchesTaskType(task, filters.jenis_beban);

      if (!matchPml || !matchPetugas || !matchTaskType) {
        return false;
      }

      if (filters.tanggal) {
        const reportTaskIds = getTaskReportIdLookup(task);

        return Object.keys(reportTaskIds).some((taskId) => dateTaskIds[taskId]);
      }

      return true;
    });

  function getVisibleReports(filters) {
    const visibleTasks = getFilteredTasks(filters);

    const taskIds = visibleTasks.reduce((result, task) => {
      Object.assign(result, getTaskReportIdLookup(task));
      return result;
    }, {});

    return store.reports
      .filter((report) => taskIds[getReportTaskId(report)])
      .filter((report) => !filters.tanggal || report.tanggal === filters.tanggal)
      .sort((a, b) => String(b.tanggal).localeCompare(String(a.tanggal)) || String(b.created_at).localeCompare(String(a.created_at)));
  }

  function getTaskReports(taskId, filters) {
    const task = getTaskById(taskId);
    const reportTaskIds = getTaskReportIdLookup(task || { task_id: taskId });
    const cache = getTaskReportCache();
    const seen = {};
    const reports = [];

    Object.keys(reportTaskIds).forEach((reportTaskId) => {
      addReportsFromCache(reports, seen, cache.byTaskId[reportTaskId]);
    });

    const taskSlsId = getTaskSlsId(task || { task_id: taskId });

    if (taskSlsId) {
      const slsKey = reportSlsCacheKey(taskSlsId, isOrganicTask(task));
      addReportsFromCache(reports, seen, cache.bySlsKey[slsKey]);
    }

    return reports.filter((report) => !filters.tanggal || report.tanggal === filters.tanggal);
  }

  function getTaskTotal(taskId, filters) {
    const normalizedTaskId = normalizeIdText(taskId);
    const dateFilter = filters && filters.tanggal ? filters.tanggal : "";
    const cacheKey = `${normalizedTaskId}|${dateFilter}`;

    if (taskTotalCache[cacheKey] !== undefined) {
      return taskTotalCache[cacheKey];
    }

    taskTotalCache[cacheKey] = getTaskReports(taskId, filters || {}).reduce((sum, report) => sum + getReportMuatanValue(report), 0);
    return taskTotalCache[cacheKey];
  }

  function getTaskProgress(task, filters) {
    const target = getTaskTargetValue(task);

    if (target <= 0) {
      return 0;
    }

    return percentValue(getTaskTotal(task.task_id, filters || {}), target);
  }

  function isTaskCompleted(task) {
    return String(task && task.completed).toUpperCase() === "TRUE";
  }

  function getSummary(tasks, filters) {
    const totalTarget = tasks.reduce((sum, task) => sum + getTaskTargetValue(task), 0);
    const totalTercacah = tasks.reduce((sum, task) => sum + getTaskTotal(task.task_id, filters), 0);
    const sisa = Math.max(totalTarget - totalTercacah, 0);
    const progress = percentValue(totalTercacah, totalTarget);

    return {
      totalTarget,
      totalTercacah,
      sisa,
      progress
    };
  }

  function getFilteredTaskRows() {
    return getTaskMonitoringTasks().filter((task) => {
      const matchPml = !taskFilters.pml_id || task.pml_id === taskFilters.pml_id;
      const matchPetugas = !taskFilters.petugas_id || task.petugas_id === taskFilters.petugas_id;
      const matchKorwil = !taskFilters.korwil || task.korwil === taskFilters.korwil;
      const matchKecamatan = !taskFilters.kecamatan || task.kecamatan === taskFilters.kecamatan;
      const matchTaskType = matchesTaskType(task, taskFilters.jenis_beban);
      const matchStatus = !taskFilters.status || getTaskListStatus(task) === taskFilters.status;

      return matchPml && matchPetugas && matchKorwil && matchKecamatan && matchTaskType && matchStatus;
    }).slice().sort(sortTaskRows);
  }

  function getTaskListStatus(task) {
    if (isTaskCompleted(task)) {
      return "selesai";
    }

    return getTaskTotal(task.task_id, {}) > 0 ? "berjalan" : "perlu_perhatian";
  }

  function getTaskStatusSummary(tasks) {
    return tasks.reduce((summary, task) => {
      const status = getTaskListStatus(task);

      if (status === "selesai") {
        summary.selesai += 1;
      } else if (status === "berjalan") {
        summary.berjalan += 1;
      } else {
        summary.perluPerhatian += 1;
      }

      return summary;
    }, {
      selesai: 0,
      berjalan: 0,
      perluPerhatian: 0
    });
  }

  function sortTaskRows(a, b) {
    const sort = parseTableSortKey(taskFilters.sort, "progress", "asc");

    return compareSortValues(getTaskSortValue(a, sort.key), getTaskSortValue(b, sort.key), sort.dir)

      || taskLabel(a).localeCompare(taskLabel(b), "id");

  function getPetugasPerformanceRows(filters) {
    const scopedPetugas = getPerformancePetugas()
      .filter((petugas) => !filters.pml_id || petugas.pml_id === filters.pml_id)
      .filter((petugas) => !filters.petugas_id || petugas.petugas_id === filters.petugas_id);
    const scopedTasks = getPerformanceTasks().filter((task) => {
      const matchPml = !filters.pml_id || task.pml_id === filters.pml_id;
      const matchPetugas = !filters.petugas_id || task.petugas_id === filters.petugas_id;
      const matchKorwil = !filters.korwil || task.korwil === filters.korwil;
      const matchKecamatan = !filters.kecamatan || task.kecamatan === filters.kecamatan;
      const matchTaskType = matchesTaskType(task, filters.jenis_beban);

      return matchPml && matchPetugas && matchKorwil && matchKecamatan && matchTaskType;
    });
    const taskMap = {};

    const latestReportByPetugas = {};
    const dailyTargetByPetugas = {};

    scopedTasks.forEach((task) => {
      if (!tasksByPetugas[task.petugas_id]) {
        tasksByPetugas[task.petugas_id] = [];

      tasksByPetugas[task.petugas_id].push(task);

      Object.keys(getTaskReportIdLookup(task)).forEach((taskId) => {

      });
      totalsByTask[task.task_id] = 0;
    });

    store.reports.forEach((report) => {
      const task = taskMap[getReportTaskId(report)];

      if (!task) {
        return;
      }

      totalsByTask[task.task_id] += getReportMuatanValue(report);

      const currentLatest = latestReportByPetugas[task.petugas_id];
      const nextDate = `${report.tanggal || ""} ${report.created_at || ""}`;
      const currentDate = currentLatest ? `${currentLatest.tanggal || ""} ${currentLatest.created_at || ""}` : "";

      if (!currentLatest || nextDate > currentDate) {
        latestReportByPetugas[task.petugas_id] = report;
      }
    });

    getDailyTargetRowsForPetugas(scopedPetugas, scopedTasks, store.reports, todayDateText()).forEach((row) => {
      dailyTargetByPetugas[row.petugas_id] = row;
    });

    return scopedPetugas.map((petugas) => {
      const tasks = tasksByPetugas[petugas.petugas_id] || [];
      const totalKeluarga = tasks.reduce((sum, task) => sum + asNumber(task.keluarga), 0);
      const totalTarget = tasks.reduce((sum, task) => sum + getTaskTargetValue(task), 0);
      const totalTercacah = tasks.reduce((sum, task) => sum + asNumber(totalsByTask[task.task_id]), 0);
      const progress = percentValue(totalTercacah, totalTarget);
      const latestReport = latestReportByPetugas[petugas.petugas_id];
      const status = getPerformanceStatus(tasks, totalTercacah);
      const dailyTarget = dailyTargetByPetugas[petugas.petugas_id] || {
        targetHariIni: 0,
        realisasiHariIni: 0,
        realisasiKumulatif: 0,
        targetKumulatif: 0,
        progress: 0
      };

      return {
        petugas_id: petugas.petugas_id,
        petugas: petugas.nama_petugas || "-",
        pml: pmlName(petugas.pml_id),
        korwil: uniqueValues(tasks.map((task) => task.korwil)).map(titleCase).join(", ") || "-",
        kecamatan: uniqueValues(tasks.map((task) => task.kecamatan)).map(titleCase).join(", ") || "-",
        totalWilayah: countUniqueSls(tasks),
        totalKeluarga,
        selesaiWilayah: tasks.filter(isTaskCompleted).length,
        totalTarget,
        totalTercacah,
        sisaTarget: Math.max(totalTarget - totalTercacah, 0),
        progress,
        targetHariIni: dailyTarget.targetHariIni,
        realisasiHariIni: dailyTarget.realisasiHariIni,
        realisasiHarianKumulatif: dailyTarget.realisasiKumulatif,
        targetHarianKumulatif: dailyTarget.targetKumulatif,
        progressHarian: dailyTarget.progress,
        status,
        laporanTerakhir: latestReport ? latestReport.tanggal : "-",
        tasks: tasks.slice().sort((a, b) => {
          return String(a.kecamatan).localeCompare(String(b.kecamatan), "id")
            || String(a.desa).localeCompare(String(b.desa), "id")
            || String(a.sls).localeCompare(String(b.sls), "id");
        }),
        sortProgress: totalTarget > 0 ? progress : Number.POSITIVE_INFINITY
      };
    }).filter((row) => {
      return row.tasks.length && (!filters.status || row.status === filters.status);
    }).sort((a, b) => sortPerformanceRows(a, b, filters.sort));
  }

  function sortPerformanceRows(a, b, sortKey) {
    const sort = parseTableSortKey(sortKey, "progress_total", "asc");
    const factor = sort.dir === "desc" ? -1 : 1;

    let diff = 0;
    if (sort.key === "progress_total" || sort.key === "progress") diff = a.sortProgress - b.sortProgress;
    else if (sort.key === "sisa") diff = a.sisaTarget - b.sisaTarget;
    else if (sort.key === "target") diff = a.totalTarget - b.totalTarget;
    else if (sort.key === "tercacah") diff = a.totalTercacah - b.totalTercacah;
    else if (sort.key === "target_hari_ini") diff = a.targetHariIni - b.targetHariIni;
    else if (sort.key === "progress_harian") diff = a.progressHarian - b.progressHarian;
    else if (sort.key === "kum_harian") diff = a.realisasiHarianKumulatif - b.realisasiHarianKumulatif;
    else if (sort.key === "selesai") diff = a.selesaiWilayah - b.selesaiWilayah;
    else if (sort.key === "keluarga") diff = a.totalKeluarga - b.totalKeluarga;
    else if (sort.key === "sls") diff = a.totalWilayah - b.totalWilayah;
    else if (sort.key === "status") diff = statusSortRank(a.status) - statusSortRank(b.status);
    else if (sort.key === "laporan_terakhir") diff = String(a.laporanTerakhir || "").localeCompare(String(b.laporanTerakhir || ""), "id");
    else if (sort.key === "petugas") diff = String(a.petugas).localeCompare(String(b.petugas), "id");
    else if (sort.key === "pml") diff = String(a.pml).localeCompare(String(b.pml), "id");
    else if (sort.key === "korwil") diff = String(a.korwil).localeCompare(String(b.korwil), "id");
    else if (sort.key === "kecamatan") diff = String(a.kecamatan).localeCompare(String(b.kecamatan), "id");
    else diff = a.sortProgress - b.sortProgress;

    return diff * factor
      || b.sisaTarget - a.sisaTarget
      || String(a.petugas).localeCompare(String(b.petugas), "id");
  }

  function parseTableSortKey(sortKey, fallbackKey, fallbackDir) {
    const text = String(sortKey || "");

    if (text.endsWith("_desc")) {
      return {
        key: text.slice(0, -5),
        dir: "desc"
      };
    }

    if (text.endsWith("_asc")) {
      return {
        key: text.slice(0, -4),
        dir: "asc"
      };
    }

    return {
      key: text || fallbackKey,
      dir: fallbackDir || "asc"
    };
  }

  function sortableTableHeader(tableKey, sortKey, label, title) {
    const currentSort = parseTableSortKey(getTableSortValue(tableKey), "", "");
    const active = currentSort.key === sortKey;
    const direction = active ? currentSort.dir : "";
    const arrow = active && direction === "asc" ? "&#9650;" : "&#9660;";
    const plainLabel = stripHtml(label);
    const sortTitle = title || `Urutkan ${plainLabel}`;

    return `
        <th class="sortable-table-col ${active ? "active" : ""}" data-table-sort="${escapeHtml(tableKey)}" data-sort-key="${escapeHtml(sortKey)}" aria-sort="${active ? (direction === "asc" ? "ascending" : "descending") : "none"}">
          <button class="sortable-table-button" type="button" title="${escapeHtml(sortTitle)}">
            <span class="sortable-table-label">${label}</span>
            <span class="sortable-table-arrow" aria-hidden="true">${arrow}</span>
          </button>
        </th>
      `;
  }

  function stripHtml(value) {
    return cleanDisplayText(String(value || "").replace(/<[^>]*>/g, " "));
  }

  function getTableSortValue(tableKey) {
    if (tableKey === "tasks") {
      return taskFilters.sort;
    }

    if (tableKey === "prelist") {
      return prelistFilters.sort;
    }

    return tableSortState[tableKey] || "";
  }

  function setTableSortValue(tableKey, sortValue) {
    if (tableKey === "tasks") {
      taskFilters.sort = sortValue;
      return;
    }

    if (tableKey === "prelist") {
      prelistFilters.sort = sortValue;
      return;
    }

    tableSortState[tableKey] = sortValue;
  }

  function nextTableSortValue(tableKey, sortKey) {
    const currentSort = parseTableSortKey(getTableSortValue(tableKey), "", "");
    const nextDir = currentSort.key === sortKey && currentSort.dir === "asc" ? "desc" : "asc";

    return `${sortKey}_${nextDir}`;
  }

  function sortRowsByTable(rows, tableKey, valueGetter, fallbackCompare) {
    const sourceRows = (rows || []).slice();
    const sort = parseTableSortKey(getTableSortValue(tableKey), "", "");

    if (!sort.key) {
      return fallbackCompare ? sourceRows.sort(fallbackCompare) : sourceRows;
    }

    return sourceRows.sort((a, b) => {
      return compareSortValues(valueGetter(a, sort.key), valueGetter(b, sort.key), sort.dir)
        || (fallbackCompare ? fallbackCompare(a, b) : 0);
    });
  }

  function compareSortValues(a, b, direction) {
    const dir = direction === "desc" ? -1 : 1;
    const aEmpty = isEmptySortValue(a);
    const bEmpty = isEmptySortValue(b);

    if (aEmpty || bEmpty) {
      if (aEmpty && bEmpty) {
        return 0;
      }

      return aEmpty ? 1 : -1;
    }

    const numberA = sortNumberValue(a);
    const numberB = sortNumberValue(b);
    let diff = 0;

    if (numberA !== null && numberB !== null) {
      diff = numberA - numberB;
    } else {
      diff = String(a).localeCompare(String(b), "id", {
        numeric: true,
        sensitivity: "base"
      });
    }

    return diff * dir;
  }

  function isEmptySortValue(value) {
    return value === undefined || value === null || String(value).trim() === "" || String(value).trim() === "-";
  }

  function sortNumberValue(value) {
    if (typeof value === "number") {
      return Number.isFinite(value) ? value : null;
    }

    const text = String(value).trim().replace(/\./g, "").replace(",", ".");

    if (!/^-?\d+(\.\d+)?$/.test(text)) {
      return null;
    }

    const number = Number(text);
    return Number.isFinite(number) ? number : null;
  }

  function compareDailyReports(a, b) {
    return String(b.tanggal || "").localeCompare(String(a.tanggal || ""), "id")
      || String(b.created_at || "").localeCompare(String(a.created_at || ""), "id");
  }

      || String(a.sls || "").localeCompare(String(b.sls || ""), "id")

  }

  function getFasihPerformanceData() {
    const summary = getFasihSummary();
    const petugasByEmail = {};
    const byEmail = {};

    store.petugas.forEach((petugas) => {
      const email = normalizeEmail(petugas.email_petugas || petugas.email || petugas.Email);

      if (email) {
        petugasByEmail[email] = petugas;

    (store.fasih || []).forEach((row) => {
      const email = normalizeEmail(row.email || row.Email || row.username || row.Username);

      if (!email) {
        return;
      }

      if (!byEmail[email]) {
        byEmail[email] = {
          email,
          fullname: cleanDisplayText(row.fullname || row.Fullname),
          username: cleanDisplayText(row.username || row.Username),
          uniqueSls: {},
          open: 0,
          draft: 0,
          submitted_by_pencacah: 0,
          submitted_respondent: 0,
          rejected: 0,
          approved: 0,
          revoked_by_pengawas: 0,
          edited_by_pengawas: 0,
          edited_by_admin_kabupaten: 0,
          total_status: 0
        };
      }

      const group = byEmail[email];

      }

      group.open += asNumber(row.open || row.Open);
      group.draft += asNumber(row.draft || row.Draft);
      group.submitted_by_pencacah += asNumber(row.submitted_by_pencacah || row.Submitted_By_Pencacah);
      group.submitted_respondent += asNumber(row.submitted_respondent || row.Submitted_Respondent);
      group.rejected += asNumber(row.rejected || row.Rejected);
      group.approved += asNumber(row.approved || row.Approved);
      group.revoked_by_pengawas += asNumber(row.revoked_by_pengawas || row.Revoked_By_Pengawas);
      group.edited_by_pengawas += asNumber(row.edited_by_pengawas || row.Edited_By_Pengawas);
      group.edited_by_admin_kabupaten += asNumber(row.edited_by_admin_kabupaten || row.Edited_By_Admin_Kabupaten);
      group.total_status += asNumber(row.total_status || row.Total_Status);
    });

    const petugasRows = Object.values(byEmail).map((group) => {
      const petugas = petugasByEmail[group.email];
      const submitted = group.submitted_by_pencacah + group.submitted_respondent;
      const reviewed = group.rejected + group.approved;
      const adjusted = group.revoked_by_pengawas + group.edited_by_pengawas + group.edited_by_admin_kabupaten;
      const submittedAssignment = fasihSubmittedAssignment(group);
      const persentase = percentValue(submittedAssignment, group.total_status);

      return {
        petugas_id: petugas ? petugas.petugas_id : "",
        petugas: petugas
          ? petugas.nama_petugas
          : group.fullname || group.username || group.email || "-",
        pml_id: petugas ? petugas.pml_id : "",
        pml: petugas ? pmlName(petugas.pml_id) : "-",
        email: group.email,
        mapped: Boolean(petugas),
        unique_sls: Object.keys(group.uniqueSls).length,
        open: group.open,
        draft: group.draft,
        submitted_by_pencacah: group.submitted_by_pencacah,
        submitted_respondent: group.submitted_respondent,
        submitted,
        rejected: group.rejected,
        approved: group.approved,
        revoked_by_pengawas: group.revoked_by_pengawas,
        edited_by_pengawas: group.edited_by_pengawas,
        edited_by_admin_kabupaten: group.edited_by_admin_kabupaten,
        adjusted,
        submitted_assignment: submittedAssignment,
        persentase,
        total_status: group.total_status
      };
    }).sort((a, b) => {
      if (a.mapped !== b.mapped) {
        return a.mapped ? -1 : 1;
      }

      return String(a.pml).localeCompare(String(b.pml), "id")
        || b.submitted - a.submitted
        || b.total_status - a.total_status
        || String(a.petugas).localeCompare(String(b.petugas), "id");
    });

    const pmlGroups = {};

    petugasRows.forEach((row) => {
      const key = row.pml_id || "__fasih_snapshot__";

      if (!pmlGroups[key]) {
        pmlGroups[key] = {
          pml_id: row.pml_id,
          pml: row.pml,
          petugas: {},
          open: 0,
          draft: 0,
          submitted: 0,
          rejected: 0,
          approved: 0,
          revoked_by_pengawas: 0,
          edited_by_pengawas: 0,
          edited_by_admin_kabupaten: 0,
          adjusted: 0,
          submitted_assignment: 0,
          total_status: 0
        };
      }

      const group = pmlGroups[key];
      group.petugas[row.email || row.petugas] = true;
      group.open += row.open;
      group.draft += row.draft;
      group.submitted += row.submitted;
      group.rejected += row.rejected;
      group.approved += row.approved;
      group.revoked_by_pengawas += row.revoked_by_pengawas;
      group.edited_by_pengawas += row.edited_by_pengawas;
      group.edited_by_admin_kabupaten += row.edited_by_admin_kabupaten;
      group.adjusted += row.adjusted;
      group.submitted_assignment += row.submitted_assignment;
      group.total_status += row.total_status;
    });

    const fasihReferenceDate = getFasihReferenceDate(summary);
    const reviewDayCount = getDailyTargetDayCount(fasihReferenceDate);

    const pmlRows = Object.values(pmlGroups).map((group) => {
      const reviewed = group.rejected + group.approved;
      const petugasCount = Object.keys(group.petugas).length;
      const reviewTarget = FASIH_PML_REVIEW_TARGET_BASE * petugasCount * reviewDayCount;

      return {
        ...group,
        petugasCount,
        reviewed,
        reviewTarget,
        reviewProgress: percentValue(reviewed, reviewTarget)
      };
    }).sort(sortFasihPmlRows);

    return {
      summary,
      petugasRows,
      pmlRows,
      reviewDayCount,
      reviewTargetTotal: pmlRows.reduce((sum, row) => sum + row.reviewTarget, 0),
      mappedCount: petugasRows.filter((row) => row.mapped).length
    };
  }

  function sortFasihPmlRows(a, b) {
    const sort = parseTableSortKey(performanceFilters.fasihPmlSort, "reviewProgress", "asc");
    const factor = sort.dir === "desc" ? -1 : 1;
    let diff = 0;

    if (sort.key === "pml") diff = String(a.pml).localeCompare(String(b.pml), "id");
    else if (sort.key === "petugas") diff = a.petugasCount - b.petugasCount;
    else if (sort.key === "reviewTarget") diff = a.reviewTarget - b.reviewTarget;
    else if (sort.key === "reviewProgress") diff = a.reviewProgress - b.reviewProgress;
    else if (hasNumericValue(a[sort.key]) || hasNumericValue(b[sort.key])) diff = asNumber(a[sort.key]) - asNumber(b[sort.key]);
    else diff = String(a[sort.key] || "").localeCompare(String(b[sort.key] || ""), "id");

    return diff * factor
      || a.reviewProgress - b.reviewProgress
      || b.total_status - a.total_status
      || String(a.pml).localeCompare(String(b.pml), "id");
  }

  function getFilteredFasihPmlRows(rows) {
    const keyword = cleanDisplayText(performanceFilters.fasihPmlKeyword).toLowerCase();
    const status = cleanDisplayText(performanceFilters.fasihPmlReviewStatus);

    return rows.filter((row) => {
      const matchKeyword = !keyword || [
        row.pml,
        row.pml_id
      ].join(" ").toLowerCase().includes(keyword);
      let matchStatus = true;

      if (status === "behind") {
        matchStatus = row.reviewProgress < 80;
      } else if (status === "done") {
        matchStatus = row.reviewProgress >= 100;
      } else if (status === "has_rejected") {
        matchStatus = row.rejected > 0;
      } else if (status === "has_adjusted") {
        matchStatus = row.adjusted > 0;
      }

      return matchKeyword && matchStatus;
    }).slice().sort(sortFasihPmlRows);
  }

  function getFilteredFasihPetugasRows(rows) {
    const keyword = cleanDisplayText(performanceFilters.fasihPetugasKeyword).toLowerCase();
    const selectedPml = cleanDisplayText(performanceFilters.fasihPetugasPml);
    const status = cleanDisplayText(performanceFilters.fasihPetugasStatus);

    return rows.filter((row) => {
      const rowPmlValue = row.pml_id;
      const matchPml = !selectedPml || rowPmlValue === selectedPml;
      const matchKeyword = !keyword || [
        row.petugas,
        row.pml,
        row.email
      ].join(" ").toLowerCase().includes(keyword);
      let matchStatus = true;

      if (status === "has_rejected") {
        matchStatus = row.rejected > 0;
      } else if (status === "open") {
        matchStatus = row.open > 0;
      } else if (status === "submitted") {
        matchStatus = row.submitted > 0;
      } else if (status === "approved") {
        matchStatus = row.approved > 0;
      } else if (status === "adjusted") {
        matchStatus = row.adjusted > 0;
      }

      return matchPml && matchKeyword && matchStatus;
    }).slice().sort(sortFasihPetugasRows);
  }

  function getFilteredFasihContractRows() {
    const keyword = cleanDisplayText(performanceFilters.contractKeyword).toLowerCase();
    const status = cleanDisplayText(performanceFilters.contractStatus);

    return store.fasihContract.filter((row) => {
      const matchKeyword = !keyword || [
        row.ppl,
        row.email_ppl
      ].join(" ").toLowerCase().includes(keyword);

      return matchKeyword && matchStatus;

  function sortFasihContractRows(a, b) {
    const sort = parseTableSortKey(getTableSortValue("contractPerformance"), "kekurangan_termin_1", "desc");
    const factor = sort.dir === "desc" ? -1 : 1;
    let diff = 0;

    if (sort.key === "ppl") diff = String(a.ppl).localeCompare(String(b.ppl), "id");
    else if (sort.key === "email_ppl") diff = String(a.email_ppl).localeCompare(String(b.email_ppl), "id");
    else if (sort.key === "status_termin_1") diff = contractStatusSortValue(a.status_termin_1) - contractStatusSortValue(b.status_termin_1);
    else if (hasNumericValue(a[sort.key]) || hasNumericValue(b[sort.key])) diff = asNumber(a[sort.key]) - asNumber(b[sort.key]);
    else diff = String(a[sort.key] || "").localeCompare(String(b[sort.key] || ""), "id");

    return diff * factor
      || b.kekurangan_termin_1 - a.kekurangan_termin_1
      || String(a.ppl).localeCompare(String(b.ppl), "id");
  }

  function getPerformanceStatus(tasks, totalTercacah) {
    if (tasks.length && tasks.every(isTaskCompleted)) {
      return "selesai";

    if (totalTercacah <= 0) {

    return "berjalan";

    return {

  function matchesTaskType(task, taskType) {
    if (!taskType) {
      return true;
    }

    return taskType === "organik" ? isOrganicTask(task) : !isOrganicTask(task);
  }

  function isOrganicTask(task) {
    if (!task) {
      return false;
    }

    return String(task.task_id || "").endsWith(ORGANIC_TASK_SUFFIX)
      || task.petugas_id === ORGANIC_PETUGAS_ID
      || task.pml_id === ORGANIC_PML_ID;

  function getFilteredPrelist() {
    const keyword = prelistFilters.keyword.trim().toLowerCase();

    return store.prelist
      .filter((row) => prelistFilters.level === "all" || getPrelistGeographicLevel(row) === prelistFilters.level)
      .filter((row) => !prelistFilters.kecamatan || row.kecamatan === prelistFilters.kecamatan)
      .filter((row) => !prelistFilters.desa || row.desa === prelistFilters.desa)
      .filter((row) => {
        if (!keyword) {
          return true;
        }

        return [
          row.idsubsls,
          row.kecamatan,
          row.desa,
          row.nama_sls
        ].join(" ").toLowerCase().includes(keyword);
      });

  function sortPrelistRows(a, b) {
    const sort = parseTableSortKey(prelistFilters.sort, "total", "desc");

    return compareSortValues(getPrelistSortValue(a, sort.key), getPrelistSortValue(b, sort.key), sort.dir)
      || String(a.kecamatan || "").localeCompare(String(b.kecamatan || ""), "id")
      || String(a.desa || "").localeCompare(String(b.desa || ""), "id")
      || String(a.nama_sls || "").localeCompare(String(b.nama_sls || ""), "id");
  }

  function getSortedPrelistRows(rows) {
    const levelOrder = {
      sls: 0,
      desa: 1,
      kecamatan: 2,
      unidentified: 3
    };

    if (prelistFilters.level === "all") {
      return rows.slice().sort((a, b) => {
        const levelDifference = levelOrder[getPrelistGeographicLevel(a)] - levelOrder[getPrelistGeographicLevel(b)];
        return levelDifference || sortPrelistRows(a, b);
      });
    }

    return rows.slice().sort(sortPrelistRows);
  }

  function paginateRows(rows) {
    const sortedRows = getSortedPrelistRows(rows);
    const pageSize = Number(prelistFilters.pageSize) || 25;
    const totalPages = Math.max(1, Math.ceil(sortedRows.length / pageSize));
    const page = Math.min(Math.max(Number(prelistFilters.page) || 1, 1), totalPages);
    const startIndex = (page - 1) * pageSize;
    const endIndex = Math.min(startIndex + pageSize, sortedRows.length);

    prelistFilters.page = page;

    return {
      rows: sortedRows.slice(startIndex, endIndex),
      page,
      pageSize,
      totalPages,
      startIndex,
      endIndex
    };
  }

  function paginatePlainRows(rows, state) {
    const pageSize = Number(state.pageSize) || 25;
    const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
    const page = Math.min(Math.max(Number(state.page) || 1, 1), totalPages);
    const startIndex = (page - 1) * pageSize;
    const endIndex = Math.min(startIndex + pageSize, rows.length);

    state.page = page;

    return {
      rows: rows.slice(startIndex, endIndex),
      page,
      pageSize,
      totalPages,
      startIndex,
      endIndex
    };
  }

  function getVisiblePages(currentPage, totalPages) {
    if (totalPages <= 7) {
      return Array.from({ length: totalPages }, (_, index) => index + 1);
    }

    const pages = [1];
    const start = Math.max(2, currentPage - 1);
    const end = Math.min(totalPages - 1, currentPage + 1);

    if (start > 2) {
      pages.push("...");
    }

    for (let page = start; page <= end; page++) {
      pages.push(page);
    }

    if (end < totalPages - 1) {
      pages.push("...");
    }

    pages.push(totalPages);
    return pages;
  }

  function getPrelistSummary(rows) {
    return rows.reduce((summary, row) => {
      if (getPrelistGeographicLevel(row) === "sls") {
        summary.sls += 1;

      summary.usahaPertanian += asNumber(row.st2023);
      summary.muatanUsahaFinal += getPrelistMuatanUsahaFinal(row);
      return summary;
    }, {
      sls: 0,
      keluarga: 0,
      usahaPertanian: 0,
      muatanUsahaFinal: 0
    });
  }

  function getPrelistMuatanUsahaFinal(row) {
    const totalUsahaFinal = String(row.total_usaha_final ?? "").trim();

    return totalUsahaFinal
      ? asNumber(totalUsahaFinal)
      : asNumber(row.usaha_final);
  }

  function getPrelistKeluarga(row) {
    const keluargaPrelist = asNumber(row.keluarga_prelist);
    return keluargaPrelist || asNumber(row.keluarga_awal);
  }

  function getPrelistGeographicLevel(row) {
    if (row.level_geografis) {
      return String(row.level_geografis).toLowerCase();
    }

    if (row.nama_sls) {
      return "sls";
    }

    if (row.desa) {
      return "desa";
    }

    if (row.kecamatan) {
      return "kecamatan";
    }

    return "unidentified";
  }

  function uniqueValues(values) {

  function getPetugasForFilter(pmlId, taskType) {
    const visibleTaskPetugasIds = {};

    if (taskType) {
      store.tasks
        .filter((task) => (!pmlId || task.pml_id === pmlId) && matchesTaskType(task, taskType))
        .forEach((task) => {
          visibleTaskPetugasIds[task.petugas_id] = true;
        });
    }

    return store.petugas.filter((petugas) => {
      const matchPml = !pmlId || petugas.pml_id === pmlId;
      const matchTaskType = !taskType || visibleTaskPetugasIds[petugas.petugas_id];

      return matchPml && matchTaskType;
    });

  function getOperationalReports() {
    const taskIds = {};

    getOperationalTasks().forEach((task) => {
      Object.assign(taskIds, getTaskReportIdLookup(task));
    });

    return store.reports
      .filter((report) => taskIds[getReportTaskId(report)])
      .sort((a, b) => String(b.tanggal).localeCompare(String(a.tanggal)) || String(b.created_at).localeCompare(String(a.created_at)));
