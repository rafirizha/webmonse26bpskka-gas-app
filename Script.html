  function getTaskById(taskId) {
    const normalizedTaskId = normalizeIdText(taskId);

    return store.tasks.find((task) => normalizeIdText(task.task_id) === normalizedTaskId);
  }

  function getTaskReportIdLookup(task) {
    const lookup = {};

    if (!task) {
      return lookup;
    }

    const taskId = normalizeIdText(task.task_id);
    const idsubsls = normalizeIdText(task.idsubsls);
    const cleanSlsId = normalizeIdText(cleanWeeklySlsId(idsubsls));

    if (taskId) {
      lookup[taskId] = true;
    }

    if (idsubsls) {
      if (!isOrganicTask(task)) {
        lookup[idsubsls] = true;
      }
      lookup[`TASK-${idsubsls}${isOrganicTask(task) ? ORGANIC_TASK_SUFFIX : ""}`] = true;
    }

    if (cleanSlsId) {
      if (!isOrganicTask(task)) {
        lookup[cleanSlsId] = true;
      }
      lookup[`TASK-${cleanSlsId}${isOrganicTask(task) ? ORGANIC_TASK_SUFFIX : ""}`] = true;
    }

    return lookup;
  }

  function getReportTaskId(report) {
    return normalizeIdText(report && report.task_id);
  }

  function getTaskReportCache() {
    if (taskReportCache) {
      return taskReportCache;
    }

    const byTaskId = {};
    const bySlsKey = {};
    const byDateTaskId = {};

    store.reports.forEach((report) => {
      const reportTaskId = getReportTaskId(report);

      if (!reportTaskId) {
        return;
      }

      if (!byTaskId[reportTaskId]) {
        byTaskId[reportTaskId] = [];
      }

      byTaskId[reportTaskId].push(report);

      if (report.tanggal) {
        if (!byDateTaskId[report.tanggal]) {
          byDateTaskId[report.tanggal] = {};
        }

        byDateTaskId[report.tanggal][reportTaskId] = true;
      }

      const reportSlsId = getReportSlsId(reportTaskId);

      if (reportSlsId) {
        const slsKey = reportSlsCacheKey(reportSlsId, getReportTaskOrganicFlag(reportTaskId));

        if (!bySlsKey[slsKey]) {
          bySlsKey[slsKey] = [];
        }

        bySlsKey[slsKey].push(report);
      }
    });

    taskReportCache = { byTaskId, bySlsKey, byDateTaskId };
    return taskReportCache;
  }

  function reportSlsCacheKey(slsId, organic) {
    return `${normalizeIdText(slsId)}|${organic ? "1" : "0"}`;
  }

  function addReportsFromCache(target, seen, reports) {
    (reports || []).forEach((report) => {
      const key = normalizeIdText(report.report_id)
        || `${getReportTaskId(report)}|${report.tanggal || ""}|${report.created_at || ""}`;

      if (!seen[key]) {
        seen[key] = true;
        target.push(report);
      }
    });
  }

  function reportMatchesTask(report, task, lookup) {
    const reportTaskId = getReportTaskId(report);

    if (!reportTaskId) {
      return false;
    }

    if (lookup && lookup[reportTaskId]) {
      return true;
    }

    const taskSlsId = getTaskSlsId(task);
    const reportSlsId = getReportSlsId(reportTaskId);

    if (!taskSlsId || !reportSlsId || taskSlsId !== reportSlsId) {
      return false;
    }

    return getReportTaskOrganicFlag(reportTaskId) === isOrganicTask(task);
  }

  function getTaskSlsId(task) {
    return normalizeIdText(cleanWeeklySlsId(task && task.idsubsls));
  }

  function getReportSlsId(reportTaskId) {
    const cleanTaskId = normalizeIdText(reportTaskId)
      .replace(/^TASK-/i, "")
      .replace(new RegExp(`${ORGANIC_TASK_SUFFIX}$`, "i"), "");
    const match = cleanTaskId.match(/\d{10,}/);

    return match ? match[0] : cleanTaskId;
  }

  function getReportTaskOrganicFlag(reportTaskId) {
    return normalizeIdText(reportTaskId).toUpperCase().endsWith(ORGANIC_TASK_SUFFIX);
  }

  function pmlName(pmlId) {
    const pml = getPmlById(pmlId);
    return pml ? pml.nama_pml : "-";
  }

  function petugasName(petugasId) {
    const petugas = getPetugasById(petugasId);
    return petugas ? petugas.nama_petugas : "-";
  }

  function getPmlById(pmlId) {
    return store.pml.find((item) => item.pml_id === pmlId);
  }

  function getPetugasById(petugasId) {
    return store.petugas.find((item) => item.petugas_id === petugasId);
  }

  function petugasLabel(petugas) {
    return canViewAll()
      ? `${petugas.nama_petugas} (${pmlName(petugas.pml_id)})`
      : petugas.nama_petugas;
  }

  function taskLabel(task) {
    return `${task.kecamatan} - ${task.desa} - ${task.sls}`;
  }

  function taskMuatanTotal(task) {
    if (hasAnyNumericValue([task && task.keluarga, task && task.usaha, task && task.utp])) {
      return asNumber(task.keluarga) + getTaskUsahaTotal(task);
    }

    return asNumber(task && task.muatan_total) || getTaskTargetValue(task);
  }

  function getTaskTargetValue(task) {
    if (hasNumericValue(task && task.muatan_total)) {
      return asNumber(task.muatan_total);
    }

    if (hasAnyNumericValue([task && task.keluarga, task && task.usaha, task && task.utp])) {
      return asNumber(task.keluarga) + getTaskUsahaTotal(task);
    }

    return asNumber(task && task.target);
  }

  function getFasihSummary() {
    const summary = store.fasihSummary || {};

    if (summary.rows !== undefined) {
      return {
        imported_at: summary.imported_at || "",
        scraped_at: summary.scraped_at || "",
        rows: asNumber(summary.rows),
        unique_sls: asNumber(summary.unique_sls),
        open: asNumber(summary.open),
        draft: asNumber(summary.draft),
        submitted_by_pencacah: asNumber(summary.submitted_by_pencacah),
        submitted_respondent: asNumber(summary.submitted_respondent),
        rejected: asNumber(summary.rejected),
        approved: asNumber(summary.approved),
        revoked_by_pengawas: asNumber(summary.revoked_by_pengawas),
        edited_by_pengawas: asNumber(summary.edited_by_pengawas),
        edited_by_admin_kabupaten: asNumber(summary.edited_by_admin_kabupaten),
        total_status: asNumber(summary.total_status)
      };
    }

    return summarizeFasihRows(store.fasih || []);
  }

  function summarizeFasihRows(rows) {
    const uniqueSls = {};
    const summary = {
      imported_at: "",
      scraped_at: "",
      rows: rows.length,
      unique_sls: 0,
      open: 0,
      draft: 0,
      submitted_by_pencacah: 0,
      submitted_respondent: 0,
      rejected: 0,
      approved: 0,
      revoked_by_pengawas: 0,
      edited_by_pengawas: 0,
      edited_by_admin_kabupaten: 0,
      total_status: 0
    };

    rows.forEach((row) => {
      const slsCode = cleanDisplayText(row.sls_code || row.SLS_Code);

      if (slsCode) {
        uniqueSls[slsCode] = true;
      }

      summary.imported_at = summary.imported_at || row.imported_at || "";
      summary.scraped_at = summary.scraped_at || row.scraped_at || row.Scraped_At || "";
      summary.open += asNumber(row.open || row.Open);
      summary.draft += asNumber(row.draft || row.Draft);
      summary.submitted_by_pencacah += asNumber(row.submitted_by_pencacah || row.Submitted_By_Pencacah);
      summary.submitted_respondent += asNumber(row.submitted_respondent || row.Submitted_Respondent);
      summary.rejected += asNumber(row.rejected || row.Rejected);
      summary.approved += asNumber(row.approved || row.Approved);
      summary.revoked_by_pengawas += asNumber(row.revoked_by_pengawas || row.Revoked_By_Pengawas);
      summary.edited_by_pengawas += asNumber(row.edited_by_pengawas || row.Edited_By_Pengawas);
      summary.edited_by_admin_kabupaten += asNumber(row.edited_by_admin_kabupaten || row.Edited_By_Admin_Kabupaten);
      summary.total_status += asNumber(row.total_status || row.Total_Status);
    });

    summary.unique_sls = Object.keys(uniqueSls).length;

    if (!summary.total_status) {
      summary.total_status = summary.open
        + summary.draft
        + summary.submitted_by_pencacah
        + summary.submitted_respondent
        + summary.rejected
        + summary.approved
        + summary.revoked_by_pengawas
        + summary.edited_by_pengawas
        + summary.edited_by_admin_kabupaten;
    }

    return summary;
  }

  function renderFasihDashboardSummary(summary) {
    if (!summary.rows) {
      return emptyState("Belum ada data FASIH. Admin dapat import CSV dari halaman Admin.");
    }

    const submitted = summary.submitted_by_pencacah + summary.submitted_respondent;

  }

      ? renderFasihSlsTable(rows, startIndex)
      : renderFasihDesaTable(rows, startIndex);

  function ensureFasihFilterDefaults() {
    if (fasihTableFilters.level !== "sls") {
      fasihTableFilters.level = "desa";
    }

    if (fasihTableFilters.level === "sls") {
      const desaOptions = getFasihDesaOptions("");

      if (fasihTableFilters.desa !== "" && !desaOptions.includes(fasihTableFilters.desa)) {
        fasihTableFilters.desa = "";
      }

      fasihTableFilters.kecamatan = "";
      return;
    }

    const kecamatanOptions = getFasihKecamatanOptions();

    if (fasihTableFilters.kecamatan !== "" && !kecamatanOptions.includes(fasihTableFilters.kecamatan)) {
      fasihTableFilters.kecamatan = "";

    fasihTableFilters.desa = "";

  function getFasihMonitoringRows() {
    ensureFasihFilterDefaults();
    const keyword = cleanDisplayText(fasihTableFilters.keyword).toLowerCase();

    const detailRows = getFasihDetailRows()
      .filter((row) => {
        if (fasihTableFilters.level === "sls") {
          return fasihTableFilters.desa === "" || row.desa === fasihTableFilters.desa;
        }

        return fasihTableFilters.kecamatan === "" || row.kecamatan === fasihTableFilters.kecamatan;
      })
      .filter((row) => {
        if (!keyword) {
          return true;
        }

        return row.searchText.includes(keyword);
      });

    if (fasihTableFilters.level === "sls") {
      return sortFasihRows(detailRows);
    }

    return sortFasihRows(aggregateFasihRowsByDesa(detailRows));
  }

  function getFasihDetailRows() {
    if (fasihDetailRowsCache) {
      return fasihDetailRowsCache;
    }

    const taskIndex = buildFasihTaskIndex();

    fasihDetailRowsCache = store.fasih.map((row) => {
      const slsCode = cleanWeeklySlsId(row.sls_code || row.SLS_Code);
      const taskInfo = taskIndex[slsCode] || {};
      const open = asNumber(row.open || row.Open);
      const draft = asNumber(row.draft || row.Draft);
      const submitted = asNumber(row.submitted_by_pencacah || row.Submitted_By_Pencacah)
        + asNumber(row.submitted_respondent || row.Submitted_Respondent);
      const approved = asNumber(row.approved || row.Approved);
      const rejected = asNumber(row.rejected || row.Rejected);
      const adjusted = asNumber(row.revoked_by_pengawas || row.Revoked_By_Pengawas)
        + asNumber(row.edited_by_pengawas || row.Edited_By_Pengawas)
        + asNumber(row.edited_by_admin_kabupaten || row.Edited_By_Admin_Kabupaten);
      const target = asNumber(row.total_status || row.Total_Status)
        || open + draft + submitted + approved + rejected + adjusted;
      const submit = fasihSubmittedAssignment({
        open,
        draft,
        total_status: target
      });
      const detailRow = {
        level: "sls",
        slsCode,
        kecamatan: taskInfo.kecamatan || "Tidak terpetakan",
        desa: taskInfo.desa || "Tidak terpetakan",
        sls: taskInfo.sls || row.sls_name || row.SLS_Name || "-",
        petugas: taskInfo.petugas || "",
        pml: taskInfo.pml || "",
        target,
        open,
        draft,
        submit,
        rejected,
        progress: submit,
        slsCount: 1
      };

      detailRow.searchText = [
        detailRow.kecamatan,
        detailRow.desa,
        detailRow.sls,
        detailRow.slsCode,
        detailRow.petugas,
        detailRow.pml
      ].join(" ").toLowerCase();

      return detailRow;
    });

    return fasihDetailRowsCache;
  }

  function aggregateFasihRowsByDesa(rows) {
    const groups = {};

    rows.forEach((row) => {
      const key = `${row.kecamatan}|${row.desa}`;

      if (!groups[key]) {
        groups[key] = {
          level: "desa",
          kecamatan: row.kecamatan,
          desa: row.desa,
          target: 0,
          open: 0,
          draft: 0,
          submit: 0,
          rejected: 0,
          progress: 0,
          slsCount: 0
        };
      }

      groups[key].target += row.target;
      groups[key].open += row.open;
      groups[key].draft += row.draft;
      groups[key].submit += row.submit;
      groups[key].rejected += row.rejected;
      groups[key].progress += row.progress;
      groups[key].slsCount += 1;
    });

    return Object.keys(groups).map((key) => groups[key]);
  }

  function aggregateFasihRowsByKecamatan(rows) {
    const groups = {};

    rows.forEach((row) => {
      const key = row.kecamatan || "Tidak terpetakan";

      if (!groups[key]) {
        groups[key] = {
          level: "kecamatan",
          kecamatan: row.kecamatan,
          target: 0,
          open: 0,
          draft: 0,
          submit: 0,
          rejected: 0,
          progress: 0,
          slsCount: 0,
          desaMap: {}
        };
      }

      groups[key].target += row.target;
      groups[key].open += row.open;
      groups[key].draft += row.draft;
      groups[key].submit += row.submit;
      groups[key].rejected += row.rejected;
      groups[key].progress += row.progress;
      groups[key].slsCount += 1;
      groups[key].desaMap[row.desa || "Tidak terpetakan"] = true;
    });

    return Object.keys(groups).map((key) => {
      const row = groups[key];

      row.desaCount = Object.keys(row.desaMap).length;
      delete row.desaMap;

      return row;
    });
  }

  function buildFasihTaskIndex() {
    const groups = {};

    store.tasks.forEach((task) => {
      const slsCode = cleanWeeklySlsId(task.idsubsls);

      if (!slsCode) {
        return;
      }

      if (!groups[slsCode]) {
        groups[slsCode] = {
          task: task,
          petugasIds: {},
          pmlIds: {}
        };
      }

      if (shouldUseAsWeeklyRepresentative(groups[slsCode].task, task)) {
        groups[slsCode].task = task;
      }

      groups[slsCode].petugasIds[task.petugas_id] = true;
      groups[slsCode].pmlIds[task.pml_id] = true;
    });

    return Object.keys(groups).reduce((result, slsCode) => {
      const group = groups[slsCode];
      const task = group.task || {};

      result[slsCode] = {
        kecamatan: task.kecamatan || "",
        desa: task.desa || "",
        sls: task.sls || "",
        petugas: Object.keys(group.petugasIds).map(petugasName).filter((name) => name && name !== "-").join(", "),
        pml: Object.keys(group.pmlIds).map(pmlName).filter((name) => name && name !== "-").join(", ")

      return result;
    }, {});

  function getExpectedProgressForDate(dateText) {
    const currentDate = parseDateOnly(dateText) || parseDateOnly(todayDateText());
    const milestones = EXPECTED_PROGRESS_MILESTONES;

    if (!currentDate || !milestones.length) {
      return 0;
    }

    const firstDate = parseDateOnly(milestones[0].date);
    const lastDate = parseDateOnly(milestones[milestones.length - 1].date);

    if (currentDate <= firstDate) {
      return milestones[0].progress;
    }

    if (currentDate >= lastDate) {
      return milestones[milestones.length - 1].progress;
    }

    for (let index = 1; index < milestones.length; index++) {
      const previous = milestones[index - 1];
      const next = milestones[index];
      const previousDate = parseDateOnly(previous.date);
      const nextDate = parseDateOnly(next.date);

      if (currentDate <= nextDate) {
        const totalDays = Math.max((nextDate - previousDate) / 86400000, 1);
        const elapsedDays = Math.max((currentDate - previousDate) / 86400000, 0);
        const progress = previous.progress + ((next.progress - previous.progress) * (elapsedDays / totalDays));

        return Math.min(Math.max(progress, 0), 100);
      }
    }

    return 0;
  }

  function getFasihFreshnessStatus(summary) {
    if (!summary || !summary.rows) {

      };
    }

    const sourceText = cleanDisplayText(summary.scraped_at || summary.imported_at || summary.updated_at);
    const parsedDate = parseDateTimeValue(sourceText);

    if (!parsedDate) {
      return {
        tone: "warning",

        title: `Timestamp FASIH: ${sourceText || "-"}`

    const ageMs = Math.max(Date.now() - parsedDate.getTime(), 0);
    const ageHours = ageMs / 3600000;
    const ageLabel = formatRelativeAge(parsedDate);

    if (ageHours <= 12) {
      return {
        tone: "ready",
        ageLabel,
        badgeLabel: `FASIH ${ageLabel}`,
        pillLabel: "Data segar",
        caption: "Snapshot masih segar untuk monitoring harian.",

    }

    if (ageHours <= 24) {
      return {
        tone: "warning",
        ageLabel,
        badgeLabel: `FASIH ${ageLabel}`,
        pillLabel: "Perlu cek",
        caption: "Snapshot sudah melewati setengah hari; cek ulang sebelum keputusan detail.",
        title: `Snapshot FASIH ${formatFasihTimestamp(sourceText)} (${ageLabel}).`
      };
    }

    return {
      tone: "danger",
      ageLabel,
      badgeLabel: `FASIH ${ageLabel}`,
      pillLabel: "Data lama",
      caption: "Snapshot sudah lebih dari 24 jam; sebaiknya import ulang CSV FASIH.",

    };
  }

  function formatFasihTimestamp(value) {
    const text = cleanDisplayText(value);

    if (!text) {
      return "-";
    }

    const match = text.match(/^(\d{4})-(\d{2})-(\d{2})[T\s](\d{2}):(\d{2})(?::\d{2})?/)
      || text.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2})[.:](\d{2})/);

    if (!match) {
      return text;
    }

    const months = {
      "01": "Jan",
      "02": "Feb",
      "03": "Mar",
      "04": "Apr",
      "05": "Mei",
      "06": "Jun",
      "07": "Jul",
      "08": "Ags",
      "09": "Sep",
      "10": "Okt",
      "11": "Nov",
      "12": "Des"
    };

    const isSlashFormat = text.includes("/");
    const day = isSlashFormat ? match[1] : match[3];
    const month = isSlashFormat ? match[2] : match[2];
    const year = isSlashFormat ? match[3] : match[1];

    return `${day} ${months[month] || month} ${year}, ${match[4]}.${match[5]} WIB`;
  }

  function nowDateTimeText() {
    const now = new Date();

    return `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())} ${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
  }

  function parseDateTimeValue(value) {
    const text = cleanDisplayText(value);

    if (!text) {
      return null;
    }

    let match = text.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2})(?::(\d{2}))?)?/);

    if (match) {
      return new Date(
        Number(match[1]),
        Number(match[2]) - 1,
        Number(match[3]),
        Number(match[4] || 0),
        Number(match[5] || 0),
        Number(match[6] || 0)
      );
    }

    match = text.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2})[.:](\d{2})(?::(\d{2}))?)?/);

    if (match) {
      return new Date(
        Number(match[3]),
        Number(match[2]) - 1,
        Number(match[1]),
        Number(match[4] || 0),
        Number(match[5] || 0),
        Number(match[6] || 0)
      );
    }

    return null;
  }

  function formatRelativeAge(date) {
    if (!date) {
      return "waktu tidak terbaca";
    }

    const diffMs = Math.max(Date.now() - date.getTime(), 0);
    const diffMinutes = Math.floor(diffMs / 60000);

    if (diffMinutes < 1) {
      return "baru saja";
    }

    if (diffMinutes < 60) {
      return `${diffMinutes} menit lalu`;
    }

    const diffHours = Math.floor(diffMinutes / 60);

    if (diffHours < 24) {
      return `${diffHours} jam lalu`;
    }

    return `${Math.floor(diffHours / 24)} hari lalu`;
  }

  function setFormBusy(form, busy, label) {
    form.querySelectorAll("button, input, select, textarea").forEach((field) => {
      if (busy) {
        field.dataset.wasDisabled = field.disabled ? "true" : "false";
        field.disabled = true;
      } else {
        field.disabled = field.dataset.wasDisabled === "true";
        delete field.dataset.wasDisabled;
      }
    });

    setButtonBusy(form.querySelector("button[type='submit']"), busy, label || "Memproses...");
    form.classList.toggle("is-busy", busy);
    form.setAttribute("aria-busy", String(busy));
  }

  function setButtonBusy(button, busy, label) {
    if (!button) {
      return;
    }

    if (busy) {
      if (!button.dataset.originalHtml) {
        button.dataset.originalHtml = button.innerHTML;
      }

      button.disabled = true;
      button.classList.add("is-loading");
      button.innerHTML = `<span class="btn-spinner" aria-hidden="true"></span>${escapeHtml(label || "Memproses...")}`;
    } else {
      button.disabled = false;
      button.classList.remove("is-loading");

      if (button.dataset.originalHtml) {
        button.innerHTML = button.dataset.originalHtml;
        delete button.dataset.originalHtml;
      }
    }
  }

  function focusInputAfterRender(inputId) {
    requestAnimationFrame(() => {
      const input = document.getElementById(inputId);

      if (!input) {
        return;
      }

      input.focus();
      if (typeof input.setSelectionRange === "function") {
        input.setSelectionRange(input.value.length, input.value.length);
      }
    });
  }

  function focusTableAfterRender(anchorKey, preferredFocusId) {
    requestAnimationFrame(() => {
      const controls = document.querySelector(`[data-table-anchor="${anchorKey}"]`);
      const target = controls?.closest(".panel")
        || controls
        || document.getElementById(anchorKey);

      if (!target) {
        if (preferredFocusId) {
          focusInputAfterRender(preferredFocusId);
        }
        return;
      }

      target.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      const focusTarget = preferredFocusId
        ? document.getElementById(preferredFocusId)
        : controls?.querySelector(".page-button.active")
        || controls?.querySelector(`[data-table-page-size="${anchorKey}"]`)
        || target.querySelector("table")
        || target;

      if (!focusTarget || typeof focusTarget.focus !== "function") {
        return;
      }

      if (!focusTarget.matches("button, input, select, textarea, a[href], [tabindex]")) {
        focusTarget.setAttribute("tabindex", "-1");
      }

      try {
        focusTarget.focus({ preventScroll: true });
      } catch (error) {
        focusTarget.focus();
      }

      if (preferredFocusId && typeof focusTarget.setSelectionRange === "function") {
        focusTarget.setSelectionRange(focusTarget.value.length, focusTarget.value.length);
      }
    });
  }

  function attachStandardSortHandlers(renderCallback, rootElement, callbackMap) {

      button.addEventListener("click", () => {
        const header = button.closest("[data-table-sort]");

  function asNumber(value) {
    const number = Number(value);
    return isFinite(number) ? number : 0;
  }

  function hasNumericValue(value) {
    return value !== undefined && value !== null && String(value).trim() !== "" && isFinite(Number(value));
  }

  function hasAnyNumericValue(values) {
    return values.some(hasNumericValue);
  }

  function firstNumericValue(values) {
    const value = values.find(hasNumericValue);

    return value === undefined ? 0 : asNumber(value);
  }

  function numberText(value) {
    return asNumber(value).toLocaleString("id-ID");
  }

  function percentValue(value, target) {
    const total = asNumber(target);

    if (total <= 0) {
      return 0;
    }

    return (asNumber(value) / total) * 100;
  }

  function percentText(value) {
    return asNumber(value).toLocaleString("id-ID", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }) + "%";
  }

  function percentFrom(value, target) {
    return percentText(percentValue(value, target));
  }

  function fasihSubmittedAssignment(row) {
    return Math.max(
      asNumber(row && (row.total_status || row.Total_Status))
        - asNumber(row && (row.open || row.Open))
        - asNumber(row && (row.draft || row.Draft)),
      0
    );
  }

  function titleCase(value) {
    return String(value || "")
      .toLowerCase()
      .replace(/\b\w/g, (letter) => letter.toUpperCase());
  }

  function cleanDisplayText(value) {
    return String(value === undefined || value === null ? "" : value).trim();
  }

  function normalizeIdText(value) {
    return cleanDisplayText(value)
      .replace(/[\u200B-\u200D\uFEFF]/g, "")
      .replace(/\s+/g, "");
  }

  function shortId(value) {
    const text = cleanDisplayText(value);

    if (text.length <= 14) {
      return text || "-";
    }

    return `${text.slice(0, 8)}...${text.slice(-4)}`;
  }

  function normalizeEmail(value) {
    return cleanDisplayText(value).toLowerCase();
  }

  function escapeHtml(value) {
    return String(value === undefined || value === null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function escapeAttr(value) {
    return escapeHtml(value);
  }

  function destroyChart() {
    if (progressChart) {
      progressChart.destroy();
      progressChart = null;
    }

    if (fasihChart) {
      fasihChart.destroy();
      fasihChart = null;
    }
  }

  function showToast(message, type) {
    const toast = document.getElementById("toast");
    const isError = type === "error";
    const title = isError ? "Gagal" : "Berhasil";
    const duration = isError ? 5200 : 3600;

    toast.querySelector(".toast-title").textContent = title;
    toast.querySelector(".toast-message").textContent = message;
    toast.className = `toast ${isError ? "error" : "success"}`;
    toast.setAttribute("role", isError ? "alert" : "status");
    toast.setAttribute("aria-live", isError ? "assertive" : "polite");
    toast.setAttribute("aria-hidden", "false");
    toast.style.setProperty("--toast-duration", `${duration}ms`);

    void toast.offsetWidth;
    toast.classList.add("show");

    window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(() => {
      toast.className = "toast";
      toast.setAttribute("aria-hidden", "true");
    }, duration);
  }

  function startBusy(message) {
    const id = `${Date.now()}-${Math.random()}`;
    busyStack.push({ id: id, message: message || "Memproses..." });
    renderBusyStatus();

    return function stopBusy() {
      busyStack = busyStack.filter((item) => item.id !== id);
      renderBusyStatus();
    };
  }

  function renderBusyStatus() {
    const status = getBusyStatusElement();
    const latest = busyStack[busyStack.length - 1];

    if (!latest) {
      status.className = "busy-status";
      status.setAttribute("aria-hidden", "true");
      status.innerHTML = "";
      return;
    }

    status.className = "busy-status show";
    status.setAttribute("aria-hidden", "false");
    status.innerHTML = `
        <span class="busy-spinner" aria-hidden="true"></span>
        <span>${escapeHtml(latest.message)}</span>
      `;
  }

  function taskStatusMarkup(task) {
    const completed = isTaskCompleted(task);

    return `
        <span class="status-pill ${completed ? "done" : "open"}">
          ${completed ? "Selesai" : "Belum selesai"}
        </span>
      `;
  }

  function geographicLevelMarkup(level) {
    const normalizedLevel = String(level || "unidentified").toLowerCase();
    const labels = {
      sls: "SLS",
      desa: "Level Desa",
      kecamatan: "Level Kecamatan",
      unidentified: "Unidentified"
    };

    return `
        <span class="geo-pill ${escapeHtml(normalizedLevel)}">
          ${escapeHtml(labels[normalizedLevel] || "Tidak teridentifikasi")}
        </span>
      `;
  }

  function getBusyStatusElement() {
    let status = document.getElementById("busyStatus");

    if (!status) {
      status = document.createElement("div");
      status.id = "busyStatus";
      status.className = "busy-status";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-hidden", "true");
      document.body.appendChild(status);
    }

    return status;
  }

  function handleError(error) {
    const message = error && error.message ? error.message : "Terjadi kesalahan.";
    showToast(message, "error");

    if (message.toLowerCase().includes("sesi")) {
      storageRemove("se2026_session_token");
      sessionToken = "";
      renderLogin(false);
    }
  }

  function runServer(functionName, ...args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((error) => {
          reject(new Error(error && error.message ? error.message : String(error)));
        });

      runner[functionName](...args);
    });
  }

  function logClientTiming(label, timings) {
    const round = (value) => Math.round(Number(value) || 0);

    console.info("[perf]", label, {
      serverMs: round(timings.serverMs),
      normalizeMs: round(timings.normalizeMs),
      renderMs: round(timings.renderMs),
      totalMs: round(timings.serverMs + timings.normalizeMs + timings.renderMs)
    });
  }
</script>
