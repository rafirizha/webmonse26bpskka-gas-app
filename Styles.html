<style>
:root {
      color-scheme: light;
      --bg: #fff8f1;
      --panel: #fffdfa;
      --panel-2: #fff1e5;
      --line: #f0d9c4;
      --line-strong: #d9a57b;
      --text: #1f2933;
      --muted: #5b6470;
      --faint: #7b8794;
      --accent: #dd620a;
      --accent-dark: #9b4205;
      --accent-soft: #ffe2c7;
      --warning: oklch(68% 0.13 72);
      --danger: oklch(56% 0.16 28);
      --danger-soft: oklch(92% 0.045 28);
      --shadow: 0 18px 50px rgba(93, 58, 25, 0.12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    .auth-screen {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 440px) minmax(320px, 1fr);
    }

    .auth-panel {
      display: flex;
      align-items: center;
      padding: 48px;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .auth-card {
      width: 100%;
      max-width: 360px;
    }

    .auth-aside {
      display: grid;
      place-items: center;
      padding: 48px;
    }

    .auth-hero {
      width: min(720px, 100%);
      display: grid;
      gap: 26px;
    }

    .auth-hero-logos {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .auth-hero-logo {
      height: 64px;
      width: auto;
      display: block;
    }

    .auth-hero-logo-bps {
      height: 64px;
      width: auto;
      display: block;
    }

    .auth-kicker {
      width: fit-content;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--accent-dark);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .auth-title {
      max-width: 680px;
      color: var(--text);
      font-size: 44px;
      line-height: 1.05;
      letter-spacing: 0;
      margin-bottom: 14px;
    }

    .auth-lead {
      max-width: 600px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    .auth-proof-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      max-width: 640px;
    }

    .auth-proof {
      min-height: 104px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 250, 0.78);
      padding: 16px;
    }

    .auth-proof strong {
      display: block;
      color: var(--accent-dark);
      font-size: 28px;
      line-height: 1;
      margin: 8px 0;
    }

    .auth-note {
      max-width: 640px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 14px 16px;
      color: var(--muted);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand-mark {
      width: 44px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    h3 {
      font-size: 15px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .muted {
      color: var(--muted);
    }

    .fine {
      color: var(--faint);
      font-size: 12px;
    }

    .app-footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 12px;
    }

    .app-footer a {
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
    }

    .app-footer a:hover {
      text-decoration: underline;
    }

    .form-stack {
      display: grid;
      gap: 14px;
      margin-top: 28px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      padding: 9px 11px;
      outline: none;
      transition: border-color 160ms ease-out, box-shadow 160ms ease-out;
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(221, 98, 10, 0.18);
    }

    input[readonly] {
      background: var(--panel-2);
      color: var(--muted);
    }

    .btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 7px;
      padding: 9px 14px;
      background: var(--accent);
      color: var(--panel);
      cursor: pointer;
      font-weight: 800;
      text-decoration: none;
      transition: background 160ms ease-out, transform 160ms ease-out;
    }

    .btn:hover {
      background: var(--accent-dark);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.secondary {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line-strong);
    }

    .btn.secondary:hover {
      background: var(--panel-2);
    }

    .btn.danger {
      background: var(--danger);
      color: var(--panel);
    }

    .btn.full {
      width: 100%;
    }

    .btn:disabled,
    input:disabled,
    select:disabled,
    textarea:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 244px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 24px 18px;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .user-chip {
      display: grid;
      gap: 3px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
    }

    .role {
      width: fit-content;
      border-radius: 999px;
      padding: 2px 8px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .nav-list {
      display: grid;
      gap: 6px;
    }

    .nav-item {
      width: 100%;
      min-height: 38px;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 8px 10px;
      text-align: left;
      font-weight: 750;
    }

    .nav-item:hover,
    .nav-item.active {
      background: var(--accent-soft);
      color: var(--accent-dark);
    }

    .sidebar-actions {
      margin-top: auto;
      display: grid;
      gap: 8px;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 28px;
    }

    #content {
      flex: 1;
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .page-title {
      display: grid;
      gap: 5px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid.cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 8px 28px rgba(93, 58, 25, 0.08);
      padding: 18px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 15px;
    }

    .metric {
      min-height: 104px;
      display: grid;
      align-content: space-between;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 16px;
    }

    .metric strong {
      color: var(--accent-dark);
      font-size: 28px;
      line-height: 1;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-items: end;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 880px;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px 9px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    td {
      color: var(--text);
      font-size: 13px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .summary-row:last-child {
      border-bottom: 0;
    }

    .summary-row strong {
      color: var(--accent-dark);
    }

    .progress {
      display: grid;
      gap: 5px;
      min-width: 128px;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--panel-2);
    }

    .progress-fill {
      height: 100%;
      min-width: 0;
      border-radius: 999px;
      background: var(--accent);
    }

    .empty {
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      padding: 22px;
      color: var(--muted);
      background: var(--panel-2);
      text-align: center;
    }

    .toast {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 10;
      display: none;
      width: min(360px, calc(100vw - 36px));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 13px 14px;
      color: var(--text);
      font-weight: 700;
    }

    .toast.show {
      display: block;
    }

    .toast.error {
      border-color: oklch(76% 0.09 28);
      background: var(--danger-soft);
      color: oklch(35% 0.12 28);
    }

    .span-2 {
      grid-column: span 2;
    }

    .span-3 {
      grid-column: span 3;
    }

    .hidden {
      display: none !important;
    }

    .chart-box {
      height: 280px;
    }

    @media (max-width: 1180px) {
      .auth-title {
        font-size: 38px;
      }

      .auth-proof-grid {
        grid-template-columns: 1fr;
        max-width: 360px;
      }
    }

    @media (max-width: 980px) {
      .auth-screen,
      .app-shell {
        grid-template-columns: 1fr;
      }

      .auth-aside {
        display: none;
      }

      .auth-panel {
        min-height: 100vh;
        border-right: 0;
      }

      .sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .nav-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .sidebar-actions {
        margin-top: 0;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid.cols-2,
      .grid.cols-3,
      .grid.cols-4,
      .filters {
        grid-template-columns: 1fr;
      }

      .span-2,
      .span-3 {
        grid-column: auto;
      }
    }

    @media (max-width: 620px) {
      .main,
      .auth-panel {
        padding: 22px;
      }

      .page-head,
      .panel-head {
        display: grid;
      }

      .nav-list {
        grid-template-columns: 1fr 1fr;
      }
    }
</style>
