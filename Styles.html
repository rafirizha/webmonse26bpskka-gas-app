<style>
:root {
      color-scheme: light;
      --bg: #fff8f1;
      --panel: #fffdfa;
      --panel-2: #fff1e5;
      --line: #f0d9c4;
      --line-strong: #d9a57b;
      --text: #1f2933;
      --muted: #5b6470;
      --faint: #7b8794;
      --accent: #dd620a;
      --accent-dark: #9b4205;
      --accent-soft: #ffe2c7;
      --warning: oklch(68% 0.13 72);
      --danger: oklch(56% 0.16 28);
      --danger-soft: oklch(92% 0.045 28);
      --shadow: 0 18px 50px rgba(93, 58, 25, 0.12);
      --shadow-soft: 0 8px 28px rgba(93, 58, 25, 0.08);
      --shadow-lift: 0 16px 36px rgba(93, 58, 25, 0.14);
      --radius: 8px;
      --motion-fast: 140ms;
      --motion-base: 190ms;
      --motion-slow: 240ms;
      --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      background: #ad4704;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    .auth-screen {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 460px 1fr;
      background: var(--bg);
    }

    .auth-brand-panel {
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      color: #fff;
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .auth-brand-panel::before {
      content: "";
      position: absolute;
      top: -100px;
      right: -100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 60%);
      border-radius: 50%;
    }

    .auth-brand-badge {
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      display: grid;
      place-items: center;
      margin-bottom: 32px;
    }

    .auth-brand-badge svg {
      width: 24px;
      height: 24px;
      color: #fff;
    }

    .auth-brand-title {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.1;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }

    .auth-brand-subtitle {
      font-size: 16px;
      font-weight: 500;
      opacity: 0.9;
      margin: 0;
    }

    .auth-brand-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
      margin: 32px 0;
    }

    .auth-brand-features {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 20px;
    }

    .auth-brand-features li {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 15px;
      font-weight: 500;
      opacity: 0.95;
    }

    .auth-brand-features svg {
      width: 24px;
      height: 24px;
      opacity: 0.8;
    }

    .auth-brand-credit {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.7;
      margin: 0;
    }

    .auth-form-panel {
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--bg);
    }

    .auth-panel {
      width: 100%;
      max-width: 400px;
      display: grid;
      gap: 32px;
    }

    .auth-heading {
      text-align: center;
    }

    .auth-heading-logo {
      width: 120px;
      height: 64px;
      margin: 0 auto 24px;
    }

    .auth-heading-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .auth-heading h1 {
      color: var(--text);
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }

    .auth-heading p {
      color: var(--muted);
      font-size: 15px;
      margin: 0;
    }

    .auth-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .session-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--bg);
    }

    .session-card {
      display: grid;
      justify-items: center;
      gap: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .session-spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--accent-soft);
      border-top-color: var(--accent);
      border-radius: 999px;
      animation: spin 850ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand-mark {
      width: 44px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    h3 {
      font-size: 15px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .muted {
      color: var(--muted);
    }

    .fine {
      color: var(--faint);
      font-size: 12px;
    }

    .app-footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 12px;
    }

    .auth-footer {
      width: min(560px, 100%);
      margin-top: 6px;
      padding-top: 0;
      border-top: 0;
      color: #9a8c7e;
      text-align: center;
      font-weight: 600;
    }

    .sidebar-footer {
      margin: auto 12px 14px;
      padding-top: 14px;
      border-top-color: #efc9a8;
      color: #7d6b5d;
      font-size: 11px;
      line-height: 1.45;
    }

    .app-footer a {
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
    }

    .app-footer a:hover {
      text-decoration: underline;
    }

    .form-stack {
      display: grid;
      gap: 16px;
      margin-top: 0;
    }

    form.is-busy {
      opacity: 0.82;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .auth-field {
      position: relative;
      display: block;
    }

    .auth-field input {
      height: 40px;
      padding-left: 42px;
      padding-right: 42px;
      background: #fffefd;
      border-color: #daccc0;
      border-radius: 7px;
      color: #3f3024;
    }

    .auth-field input::placeholder {
      color: #9d948d;
    }

    .auth-field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(221, 98, 10, 0.12);
    }

    .field-icon,
    .password-toggle {
      position: absolute;
      top: 50%;
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      color: #9d948d;
    }

    .field-icon {
      left: 12px;
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    .field-icon svg,
    .password-toggle svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .password-toggle {
      right: 8px;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      transition: background 150ms ease-out, color 150ms ease-out;
    }

    .password-toggle:hover,
    .password-toggle[aria-pressed="true"] {
      background: var(--panel-2);
      color: var(--accent-dark);
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      padding: 9px 11px;
      outline: none;
      transition:
        border-color var(--motion-fast) var(--ease-out-quart),
        box-shadow var(--motion-fast) var(--ease-out-quart),
        background-color var(--motion-fast) var(--ease-out-quart);
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(221, 98, 10, 0.18);
    }

    .auth-field input {
      height: 40px;
      padding: 9px 42px;
      background: #fffefd;
      border-color: #daccc0;
      color: #3f3024;
    }

    .auth-field input:focus {
      box-shadow: 0 0 0 3px rgba(221, 98, 10, 0.12);
    }

    input[readonly] {
      background: var(--panel-2);
      color: var(--muted);
    }

    .readonly-box,
    .import-preview {
      min-height: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      padding: 12px 14px;
      background: var(--panel-2);
      color: var(--text);
    }

    .import-preview {
      justify-content: space-between;
      margin-top: 12px;
    }

    .danger-text {
      color: var(--danger);
      font-weight: 800;
    }

    .btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 7px;
      padding: 9px 14px;
      background: var(--accent);
      color: var(--panel);
      cursor: pointer;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 0 0 rgba(157, 73, 5, 0);
      transition:
        background-color var(--motion-fast) var(--ease-out-quart),
        border-color var(--motion-fast) var(--ease-out-quart),
        box-shadow var(--motion-base) var(--ease-out-quart),
        color var(--motion-fast) var(--ease-out-quart),
        transform var(--motion-fast) var(--ease-out-quart);
    }

    .btn:hover {
      background: var(--accent-dark);
      box-shadow: 0 10px 22px rgba(157, 73, 5, 0.14);
      transform: translateY(-1px);
    }

    .btn.is-disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .btn:active {
      box-shadow: 0 4px 10px rgba(157, 73, 5, 0.12);
      transform: translateY(0);
    }

    .btn.secondary {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line-strong);
    }

    .btn.secondary:hover {
      background: var(--panel-2);
      box-shadow: 0 8px 18px rgba(93, 58, 25, 0.08);
    }

    .btn.danger {
      background: var(--danger);
      color: var(--panel);
    }

    .btn.is-loading {
      gap: 9px;
    }

    .btn-spinner,
    .busy-spinner {
      display: inline-block;
      border-radius: 999px;
      border-style: solid;
      animation: spin 850ms linear infinite;
    }

    .btn-spinner {
      width: 15px;
      height: 15px;
      border-width: 2px;
      border-color: currentColor;
      border-right-color: transparent;
    }

    .btn.full {
      width: 100%;
    }

    .auth-card .btn.full {
      min-height: 42px;
      margin-top: 12px;
      border-radius: 8px;
      box-shadow: 0 12px 22px rgba(221, 98, 10, 0.18);
    }

    .btn:disabled,
    .topbar-icon-button:disabled,
    .profile-menu-item:disabled,
    input:disabled,
    select:disabled,
    textarea:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .btn:disabled,
    .btn.is-disabled,
    .topbar-icon-button:disabled,
    .profile-menu-item:disabled {
      box-shadow: none;
      transform: none;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 256px minmax(0, 1fr);
      grid-template-rows: 66px minmax(0, 1fr);
      background: var(--bg);
    }

    .sidebar-backdrop {
      display: none;
    }

    .app-topbar {
      position: sticky;
      top: -1px;
      z-index: 30;
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-width: 0;
      min-height: 66px;
      padding: 0 28px;
      background: #ad4704;
      border-bottom: 1px solid rgba(113, 43, 0, 0.22);
      box-shadow: 0 -2px 0 #ad4704;
      color: #fffaf4;
    }

    .topbar-left {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .topbar-brand {
      margin-bottom: 0;
      color: #fffaf4;
      line-height: 1.2;
    }

    .topbar-brand .brand-mark {
      width: 40px;
      height: 32px;
      border-radius: 0;
      background: transparent;
    }

    .topbar-actions {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .freshness-badges {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 7px;
    }

    .freshness-badge {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 4px 9px;
      background: rgba(255, 255, 255, 0.1);
      color: #fffaf4;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .freshness-badge span {
      opacity: 0.78;
      text-transform: uppercase;
    }

    .freshness-badge strong {
      font-size: 11px;
      font-weight: 900;
    }

    .freshness-badge.ready {
      border-color: rgba(187, 247, 208, 0.45);
      background: rgba(20, 83, 45, 0.2);
    }

    .freshness-badge.warning {
      border-color: rgba(254, 240, 138, 0.5);
      background: rgba(133, 77, 14, 0.25);
    }

    .freshness-badge.danger {
      border-color: rgba(254, 202, 202, 0.5);
      background: rgba(127, 29, 29, 0.24);
    }

    .freshness-badge.muted {
      opacity: 0.75;
    }

    .topbar-icon-button,
    .topbar-profile {
      border: 0;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      color: #fffaf4;
      transition:
        background-color var(--motion-fast) var(--ease-out-quart),
        box-shadow var(--motion-fast) var(--ease-out-quart),
        transform var(--motion-fast) var(--ease-out-quart);
    }

    .topbar-icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
    }

    .topbar-icon-button.is-loading {
      font-size: 0;
    }

    .topbar-icon-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .topbar-icon-button:hover {
      background: rgba(255, 255, 255, 0.13);
      transform: translateY(-1px);
    }

    .profile-menu-wrap {
      position: relative;
      display: grid;
      place-items: center;
    }

    .topbar-profile {
      display: grid;
      place-items: center;
      padding: 0;
    }

    .topbar-profile:hover,
    .topbar-profile.active,
    .topbar-profile[aria-expanded="true"] {
      background: transparent;
    }

    .profile-avatar {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 999px;
      background: #e88700;
      color: #fffaf4;
      font-size: 13px;
      font-weight: 900;
    }

    .topbar-profile:hover .profile-avatar,
    .topbar-profile.active .profile-avatar,
    .topbar-profile[aria-expanded="true"] .profile-avatar {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.22);
    }

    .profile-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      z-index: 45;
      width: 300px;
      overflow: hidden;
      border: 1px solid #ead1b8;
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 38px rgba(93, 58, 25, 0.18);
      color: var(--text);
      transform-origin: top right;
      animation: popoverIn var(--motion-slow) var(--ease-out-expo);
    }

    .profile-menu[hidden] {
      display: none;
    }

    .profile-menu-head {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .profile-menu-head strong,
    .profile-menu-head span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-menu-head strong {
      color: var(--text);
      font-size: 14px;
    }

    .profile-menu-head span {
      color: var(--faint);
      font-size: 12px;
      font-weight: 700;
    }

    .profile-avatar-soft {
      width: 38px;
      height: 38px;
      border-color: #f2d28f;
      background: #fff6cf;
      color: #a74a05;
    }

    .profile-menu-item {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      padding: 10px 16px;
      text-align: left;
      font-weight: 750;
      transition:
        background-color var(--motion-fast) var(--ease-out-quart),
        color var(--motion-fast) var(--ease-out-quart),
        transform var(--motion-fast) var(--ease-out-quart);
    }

    .profile-menu-item:hover {
      background: var(--panel-2);
      color: var(--accent-dark);
      transform: translateX(2px);
    }

    .profile-menu-item svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
      flex: 0 0 auto;
    }

    .menu-button {
      width: 40px;
      height: 40px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0;
      color: #fffaf4;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 160ms ease-out, color 160ms ease-out;
    }

    .menu-button:hover {
      color: #fffaf4;
      background: rgba(255, 255, 255, 0.14);
    }

    .menu-button:focus-visible {
      outline: 2px solid rgba(221, 98, 10, 0.42);
      outline-offset: 3px;
    }

    .menu-button span {
      width: 19px;
      height: 2px;
      background: currentColor;
      border-radius: 2px;
    }

    .sidebar {
      position: sticky;
      top: 66px;
      grid-column: 1;
      grid-row: 2;
      height: calc(100vh - 66px);
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0;
      background: #fff3e7;
      border-right: 1px solid #efc9a8;
      color: var(--text);
    }

    .user-chip {
      display: grid;
      gap: 3px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
    }

    .role {
      width: fit-content;
      border-radius: 999px;
      padding: 2px 8px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .nav-list {
      display: grid;
      gap: 5px;
      padding: 18px 12px;
    }

    .nav-item {
      width: 100%;
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-radius: 8px;
      background: transparent;
      color: #5f4230;
      cursor: pointer;
      padding: 8px 10px;
      text-align: left;
      font-size: 13px;
      font-weight: 750;
      transition:
        background-color var(--motion-fast) var(--ease-out-quart),
        box-shadow var(--motion-base) var(--ease-out-quart),
        color var(--motion-fast) var(--ease-out-quart),
        transform var(--motion-fast) var(--ease-out-quart);
    }

    .nav-icon {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 6px;
      background: #ffe1c4;
      color: #9a4205;
      transition:
        background-color var(--motion-fast) var(--ease-out-quart),
        color var(--motion-fast) var(--ease-out-quart),

      border-bottom-color: var(--accent-dark) !important;
      border-top-color: var(--accent-dark) !important;
      opacity: 0.65;
    }

    /* header filter inputs removed per user request; keep titles centered */

    .weekly-tabulator .tabulator-col:not(.tabulator-frozen-left) {
      border-left: 1px solid #f5e0cd;
    }

    /* Scrollbar styling */
    .weekly-tabulator .tabulator-tableholder::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }

    .weekly-tabulator .tabulator-tableholder::-webkit-scrollbar-track {
      background: #faf6f1;
    }

    .weekly-tabulator .tabulator-tableholder::-webkit-scrollbar-thumb {
      background: #d9a57b;
      border-radius: 4px;
    }

    .weekly-tabulator .tabulator-tableholder::-webkit-scrollbar-thumb:hover {
      background: #c9935a;
    }

    /* Row alternating with smooth transitions */
    .weekly-tabulator .tabulator-row {
      transition: background-color 0.12s ease-out, box-shadow 0.12s ease-out;
    }

    .weekly-tabulator .tabulator-row:nth-child(4n+1),
    .weekly-tabulator .tabulator-row:nth-child(4n+2) {
      background: #fffcfa;
    }

    .weekly-tabulator .tabulator-row:nth-child(4n+3),
    .weekly-tabulator .tabulator-row:nth-child(4n+4) {
      background: #fffaf7;
    }

    .weekly-tabulator .tabulator-row:hover {
      background: #fff0e0 !important;
      box-shadow: inset 0 0 0 1px rgba(221, 98, 10, 0.15);
    }

    /* Footer styling */
    .weekly-tabulator .tabulator-footer {
      background: #fff8f1;
      border-top: 2px solid #f0d9c4;
    }

    /* Better pagination controls */
    .weekly-tabulator .tabulator-page,
    .weekly-tabulator .tabulator-page-size {
      transition: all 0.15s ease-out;
      max-width: 160px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .weekly-tabulator .tabulator-page:hover {
      border-color: var(--accent);
      background: #fff3e7;
    }

    .weekly-tabulator .tabulator-page.active {
      background: #ffd2a1;
      border-color: var(--accent);
      font-weight: 800;
    }

    /* Colored, modern pagination controls */
    .weekly-tabulator .tabulator-footer .tabulator-page {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 36px;
      margin: 0 6px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--accent-dark);
      cursor: pointer;
      transition: all 140ms ease-out;
      box-shadow: none;
    }

    .weekly-tabulator .tabulator-footer .tabulator-page:hover {
      background: rgba(221, 98, 10, 0.06);
      border-color: rgba(221, 98, 10, 0.22);
      color: var(--accent-dark);
      transform: translateY(-1px);
    }

    .weekly-tabulator .tabulator-footer .tabulator-page.active {
      background: var(--accent);
      color: #fffaf4;
      border-color: var(--accent-dark);
      font-weight: 900;
      box-shadow: 0 10px 26px rgba(157, 73, 5, 0.12);
    }

    .weekly-tabulator .tabulator-page-size .tabulator-page-select,
    .weekly-tabulator .tabulator-page-size select {
      border-radius: 8px;
      padding: 6px 10px;
      min-height: 36px;
      border: 1px solid var(--line-strong);
      background: var(--panel);
      color: var(--text);
      box-shadow: none;
    }

    .weekly-tabulator .tabulator-footer .tabulator-page:first-child,
    .weekly-tabulator .tabulator-footer .tabulator-page:last-child {
      padding: 0 8px;
    }

    /* Constrain page size selector dropdown so it doesn't overflow viewport */
    .weekly-tabulator .tabulator-page-size,
    .weekly-tabulator .tabulator-page-size * {
      max-width: 260px !important;
      box-sizing: border-box;
      white-space: nowrap;
      overflow: auto;
    }

    .weekly-tabulator .tabulator-page-size .tabulator-page-select {
      max-height: 220px !important;
      overflow: auto !important;
    }

    /* Empty state styling */
    .weekly-tabulator .tabulator-placeholder {
      color: var(--muted);
      font-weight: 750;
      font-size: 14px;
      padding: 40px 20px;
    }

    .monitoring-table td {
      vertical-align: middle;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px 9px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    td {
      color: var(--text);
      font-size: 13px;
    }

    .task-table td {
      height: 56px;
      vertical-align: middle;
    }

    .clip-cell {
      min-width: 0;
    }

    .ellipsis-cell {
      max-width: 120px;
    }

    .cell-ellipsis {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cell-clamp {
      display: -webkit-box;
      max-height: 2.75em;
      overflow: hidden;
      line-height: 1.35;
      overflow-wrap: anywhere;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .number-cell {
      white-space: nowrap;
    }

    .mono-cell {
      color: var(--muted);
      font-family: "Roboto Mono", Consolas, monospace;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-cell {
      min-width: 0;
    }

    .actions-cell {
      white-space: nowrap;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .form-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .daily-context {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-2);
    }

    .daily-context-item {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .daily-context-item span,
    .daily-progress-summary span,
    .daily-progress-summary small {
      color: var(--muted);
      font-size: 12px;
    }

    .daily-context-item strong {
      overflow: hidden;
      color: var(--text);
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .daily-progress-summary {
      display: grid;
      gap: 3px;
      min-width: 220px;
    }

    .daily-progress-summary strong {
      color: var(--accent-dark);
      font-size: 24px;
      line-height: 1;
    }



    /* ── App Modal ─────────────────────────── */
    .app-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(10, 14, 20, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: overlayFadeIn var(--motion-base) var(--ease-out-quart);
    }

    @keyframes overlayFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .app-modal {
      width: min(600px, 100%);
      max-height: calc(100dvh - 40px);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      background: var(--panel);
      box-shadow: 0 24px 64px rgba(0,0,0,.45), 0 4px 12px rgba(0,0,0,.25);
      overflow: hidden;
      animation: modalSlideIn var(--motion-slow) var(--ease-out-expo);
    }

    @keyframes modalSlideIn {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .app-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .app-modal-header h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .app-modal-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition:
        background-color var(--motion-fast) var(--ease-out-quart),
        color var(--motion-fast) var(--ease-out-quart),
        transform var(--motion-fast) var(--ease-out-quart);
      flex-shrink: 0;
    }

    .app-modal-close:hover {
      background: var(--panel-2);
      color: var(--text);
      transform: rotate(90deg);
    }

    .app-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .app-modal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 20px;
    }

    .app-modal-grid .span-2 {
      grid-column: span 2;
    }

    .daily-muatan-preview {
      display: grid;
      gap: 3px;
      padding: 12px 16px;
      border: 1px solid var(--accent-dark);
      border-radius: 8px;
      background: color-mix(in srgb, var(--accent-dark) 8%, transparent);
    }

    .daily-muatan-preview span,
    .daily-muatan-preview small {
      color: var(--muted);
      font-size: 12px;
    }

    .daily-muatan-preview strong {
      color: var(--accent-dark);
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .app-modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 24px 20px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .summary-row:last-child {
      border-bottom: 0;
    }

    .summary-row strong {
      color: var(--accent-dark);
    }

    .progress {
      display: grid;
      gap: 5px;
      min-width: 128px;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--panel-2);
    }

    .progress-fill {
      height: 100%;
      min-width: 0;
      border-radius: 999px;
      background: var(--accent);
    }

    .progress-fill.over-target {
      background: var(--accent-dark);
    }

    .row-actions {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
    }

    .row-action {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--panel);
      color: var(--accent-dark);
      cursor: pointer;
      transition:
        background-color var(--motion-fast) var(--ease-out-quart),
        border-color var(--motion-fast) var(--ease-out-quart),
        box-shadow var(--motion-base) var(--ease-out-quart),
        color var(--motion-fast) var(--ease-out-quart),
        transform var(--motion-fast) var(--ease-out-quart);
    }

    .row-action:hover {
      border-color: var(--accent);
      background: var(--panel-2);
      color: #7a3303;
      box-shadow: 0 8px 18px rgba(93, 58, 25, 0.1);
      transform: translateY(-1px);
    }

    .row-action:active {
      box-shadow: 0 3px 8px rgba(93, 58, 25, 0.08);
      transform: translateY(0);
    }

    .row-action.danger {
      border-color: #e7b2a8;
      color: #b7352c;
    }

    .row-action.danger:hover {
      border-color: #c33c32;
      background: var(--danger-soft);
      color: #9f2d25;
    }

    .row-action svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .status-pill {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      transition:
        background-color var(--motion-fast) var(--ease-out-quart),
        color var(--motion-fast) var(--ease-out-quart);
    }

    .status-pill.done {
      background: var(--accent-soft);
      color: var(--accent-dark);
    }

    .status-pill.open {
      background: var(--panel-2);
      color: var(--muted);
    }

    .status-pill.warning {
      background: #fff4cc;
      color: #8a4b00;
    }

    .status-pill.danger {
      background: #ffe8e3;
      color: #b42318;
    }

    .status-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      margin: 10px 0 14px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .status-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--line-strong);
      box-shadow: 0 0 0 2px var(--panel);
    }

    .status-dot.done,
    .status-dot.success {
      background: var(--accent);
    }

    .status-dot.warning {
      background: var(--warning);
    }

    .status-dot.danger {
      background: var(--danger);
    }

    .status-dot.open,
    .status-dot.info {
      background: var(--muted);
    }

    .geo-pill {
      display: inline-flex;
      width: fit-content;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .geo-pill.sls {
      background: var(--panel-2);
      color: var(--accent-dark);
    }

    .geo-pill.desa {
      background: #fff1b8;
      color: #725400;
    }

    .geo-pill.kecamatan {
      background: var(--accent-soft);
      color: var(--accent-dark);
    }

    .geo-pill.unidentified {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .priority-number {
      color: var(--accent-dark);
      font-size: 15px;
    }

    .empty {
      display: grid;
      gap: 6px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      padding: 22px;
      color: var(--muted);
      background: var(--panel-2);
      text-align: center;
    }

    .empty strong {
      color: var(--text);
      font-size: 14px;
    }

    .empty span {
      max-width: 64ch;
      margin: 0 auto;
      line-height: 1.45;
    }

    .table-head-help {
      cursor: help;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      z-index: 80;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      width: min(420px, calc(100vw - 32px));
      min-height: 72px;
      border: 1px solid oklch(78% 0.11 145);
      border-radius: var(--radius);
      background: oklch(97% 0.03 145);
      box-shadow: 0 20px 54px rgba(28, 83, 53, 0.16);
      padding: 14px 16px 16px;
      color: oklch(29% 0.09 145);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -12px) scale(0.98);
      transition:
        opacity 180ms cubic-bezier(.22,1,.36,1),
        transform 180ms cubic-bezier(.22,1,.36,1);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
      animation: toastSlideIn 220ms cubic-bezier(.22,1,.36,1);
    }

    .toast.error {
      border-color: oklch(76% 0.09 28);
      background: var(--danger-soft);
      color: oklch(35% 0.12 28);
      box-shadow: 0 20px 54px rgba(117, 43, 34, 0.16);
    }

    .toast-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: oklch(58% 0.16 145);
      color: oklch(99% 0.01 145);
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }

    .toast-icon::before {
      content: "✓";
    }

    .toast.error .toast-icon {
      background: var(--danger);
      color: oklch(99% 0.01 28);
    }

    .toast.error .toast-icon::before {
      content: "!";
    }

    .toast-content {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .toast-title {
      font-size: 14px;
      line-height: 1.25;
      font-weight: 900;
    }

    .toast-message {
      color: inherit;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .toast-progress {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 7px;
      height: 3px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.42;
      transform-origin: left center;
      transform: scaleX(1);
    }

    .toast.show .toast-progress {
      animation: toastProgress var(--toast-duration, 3600ms) linear forwards;
    }

    @keyframes toastSlideIn {
      from {
        opacity: 0;
        transform: translate(-50%, -12px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    @keyframes toastProgress {
      to {
        transform: scaleX(0);
      }
    }

    @keyframes popoverIn {
      from {
        opacity: 0;
        transform: translateY(-6px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .panel:hover {
        border-color: #e7bd99;
        box-shadow: 0 12px 30px rgba(93, 58, 25, 0.1);
      }

      .metric:hover,
      .dashboard-metric-card:hover,
      .fasih-alert-card:hover,
      .fasih-metric:hover {
        border-color: #e7bd99;
        box-shadow: var(--shadow-lift);
        transform: translateY(-2px);
      }

      .table-wrap:hover {
        box-shadow: 0 12px 30px rgba(93, 58, 25, 0.1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    .busy-status {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 12;
      display: none;
      align-items: center;
      gap: 10px;
      width: fit-content;
      max-width: min(360px, calc(100vw - 36px));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 11px 13px;
      color: var(--text);
      font-weight: 800;
    }

    .busy-status.show {
      display: inline-flex;
    }

    .busy-spinner {
      width: 18px;
      height: 18px;
      border-width: 2px;
      border-color: var(--accent-soft);
      border-top-color: var(--accent);
      flex: 0 0 auto;
    }

    .confirm-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(31, 41, 51, 0.44);
    }

    .confirm-dialog {
      width: min(420px, 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .confirm-dialog h2 {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 1.2;
    }

    .confirm-dialog p {
      margin: 0;
      color: var(--muted);
    }

    .confirm-subject {
      display: grid;
      gap: 4px;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      padding: 12px;
    }

    .confirm-subject strong {
      color: var(--text);
      line-height: 1.35;
    }

    .confirm-subject span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .span-2 {
      grid-column: span 2;
    }

    .span-3 {
      grid-column: span 3;
    }

    .hidden {
      display: none !important;
    }

    .chart-box {
      height: 280px;
    }

    @media (max-width: 980px) {
      .auth-screen {
        grid-template-columns: 1fr;
      }

      .auth-brand-panel {
        display: none;
      }

      .auth-form-panel {
        padding: 36px 16px 28px;
        align-items: start;
        padding-top: 10vh;
      }

      .auth-card {
        padding: 24px 22px 26px;
      }

      .auth-heading-logo {
        width: 110px;
        height: 60px;
      }

      .auth-heading h1 {
        font-size: 24px;
      }

      .app-shell {
        display: block;
        min-height: 100vh;
      }

      .app-topbar {
        position: sticky;
        top: -1px;
        z-index: 30;
        min-height: 64px;
