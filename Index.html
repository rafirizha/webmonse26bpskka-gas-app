  <script>
    (function setAppFavicon() {
      const faviconLinks = [
        { rel: "icon", sizes: "32x32" },
        { rel: "shortcut icon" },
        { rel: "apple-touch-icon", sizes: "180x180" }
      ];

      faviconLinks.forEach((item) => {
        if (typeof BPS_LOGO_SRC === "undefined" || !BPS_LOGO_SRC) {
          return;
        }

        const link = document.createElement("link");

        link.rel = item.rel;
        link.type = "image/png";
        link.href = BPS_LOGO_SRC;

        if (item.sizes) {
          link.sizes = item.sizes;
        }

        document.head.appendChild(link);
      });
    })();
  </script>
