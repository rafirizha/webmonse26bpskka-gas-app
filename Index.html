<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Petugas SE2026 KKA</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff8f1;
      --panel: #fffdfa;
      --panel-2: #fff1e5;
      --line: #f0d9c4;
      --line-strong: #d9a57b;
      --text: #1f2933;
      --muted: #5b6470;
      --faint: #7b8794;
      --accent: #dd620a;
      --accent-dark: #9b4205;
      --accent-soft: #ffe2c7;
      --warning: oklch(68% 0.13 72);
      --danger: oklch(56% 0.16 28);
      --danger-soft: oklch(92% 0.045 28);
      --shadow: 0 18px 50px rgba(93, 58, 25, 0.12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    .auth-screen {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 440px) minmax(320px, 1fr);
    }

    .auth-panel {
      display: flex;
      align-items: center;
      padding: 48px;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .auth-card {
      width: 100%;
      max-width: 360px;
    }

    .auth-aside {
      display: grid;
      place-items: center;
      padding: 48px;
    }

    .auth-hero {
      width: min(720px, 100%);
      display: grid;
      gap: 26px;
    }

    .auth-hero-logo {
      width: 148px;
      height: auto;
      display: block;
    }

    .auth-kicker {
      width: fit-content;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--accent-dark);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .auth-title {
      max-width: 680px;
      color: var(--text);
      font-size: 44px;
      line-height: 1.05;
      letter-spacing: 0;
      margin-bottom: 14px;
    }

    .auth-lead {
      max-width: 600px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    .auth-proof-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      max-width: 640px;
    }

    .auth-proof {
      min-height: 104px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 250, 0.78);
      padding: 16px;
    }

    .auth-proof strong {
      display: block;
      color: var(--accent-dark);
      font-size: 28px;
      line-height: 1;
      margin: 8px 0;
    }

    .auth-note {
      max-width: 640px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 14px 16px;
      color: var(--muted);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand-mark {
      width: 44px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    h3 {
      font-size: 15px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .muted {
      color: var(--muted);
    }

    .fine {
      color: var(--faint);
      font-size: 12px;
    }

    .app-footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 12px;
    }

    .app-footer a {
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
    }

    .app-footer a:hover {
      text-decoration: underline;
    }

    .form-stack {
      display: grid;
      gap: 14px;
      margin-top: 28px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      padding: 9px 11px;
      outline: none;
      transition: border-color 160ms ease-out, box-shadow 160ms ease-out;
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(221, 98, 10, 0.18);
    }

    input[readonly] {
      background: var(--panel-2);
      color: var(--muted);
    }

    .btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 7px;
      padding: 9px 14px;
      background: var(--accent);
      color: var(--panel);
      cursor: pointer;
      font-weight: 800;
      text-decoration: none;
      transition: background 160ms ease-out, transform 160ms ease-out;
    }

    .btn:hover {
      background: var(--accent-dark);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.secondary {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line-strong);
    }

    .btn.secondary:hover {
      background: var(--panel-2);
    }

    .btn.danger {
      background: var(--danger);
      color: var(--panel);
    }

    .btn.full {
      width: 100%;
    }

    .btn:disabled,
    input:disabled,
    select:disabled,
    textarea:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 244px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 24px 18px;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .user-chip {
      display: grid;
      gap: 3px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
    }

    .role {
      width: fit-content;
      border-radius: 999px;
      padding: 2px 8px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .nav-list {
      display: grid;
      gap: 6px;
    }

    .nav-item {
      width: 100%;
      min-height: 38px;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 8px 10px;
      text-align: left;
      font-weight: 750;
    }

    .nav-item:hover,
    .nav-item.active {
      background: var(--accent-soft);
      color: var(--accent-dark);
    }

    .sidebar-actions {
      margin-top: auto;
      display: grid;
      gap: 8px;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 28px;
    }

    #content {
      flex: 1;
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .page-title {
      display: grid;
      gap: 5px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid.cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 8px 28px rgba(93, 58, 25, 0.08);
      padding: 18px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 15px;
    }

    .metric {
      min-height: 104px;
      display: grid;
      align-content: space-between;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 16px;
    }

    .metric strong {
      color: var(--accent-dark);
      font-size: 28px;
      line-height: 1;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-items: end;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 880px;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px 9px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    td {
      color: var(--text);
      font-size: 13px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .summary-row:last-child {
      border-bottom: 0;
    }

    .summary-row strong {
      color: var(--accent-dark);
    }

    .progress {
      display: grid;
      gap: 5px;
      min-width: 128px;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--panel-2);
    }

    .progress-fill {
      height: 100%;
      min-width: 0;
      border-radius: 999px;
      background: var(--accent);
    }

    .empty {
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      padding: 22px;
      color: var(--muted);
      background: var(--panel-2);
      text-align: center;
    }

    .toast {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 10;
      display: none;
      width: min(360px, calc(100vw - 36px));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 13px 14px;
      color: var(--text);
      font-weight: 700;
    }

    .toast.show {
      display: block;
    }

    .toast.error {
      border-color: oklch(76% 0.09 28);
      background: var(--danger-soft);
      color: oklch(35% 0.12 28);
    }

    .span-2 {
      grid-column: span 2;
    }

    .span-3 {
      grid-column: span 3;
    }

    .hidden {
      display: none !important;
    }

    .chart-box {
      height: 280px;
    }

    @media (max-width: 1180px) {
      .auth-title {
        font-size: 38px;
      }

      .auth-proof-grid {
        grid-template-columns: 1fr;
        max-width: 360px;
      }
    }

    @media (max-width: 980px) {
      .auth-screen,
      .app-shell {
        grid-template-columns: 1fr;
      }

      .auth-aside {
        display: none;
      }

      .auth-panel {
        min-height: 100vh;
        border-right: 0;
      }

      .sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .nav-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .sidebar-actions {
        margin-top: 0;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid.cols-2,
      .grid.cols-3,
      .grid.cols-4,
      .filters {
        grid-template-columns: 1fr;
      }

      .span-2,
      .span-3 {
        grid-column: auto;
      }
    }

    @media (max-width: 620px) {
      .main,
      .auth-panel {
        padding: 22px;
      }

      .page-head,
      .panel-head {
        display: grid;
      }

      .nav-list {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

    async function init() {

          store = normalizeStore(response.data);
          renderShell();
        } catch (error) {
          sessionStorage.removeItem("se2026_session_token");
          sessionToken = "";
          renderLogin(false);

    async function handleLogin(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const payload = formValues(form);

      setFormBusy(form, true);

      try {
        const response = await runServer("login", payload);
        sessionToken = response.token;
        currentUser = response.user;
        store = normalizeStore(response.data);
        currentView = "dashboard";
        sessionStorage.setItem("se2026_session_token", sessionToken);
        renderShell();
        showToast("Login berhasil.");
      } catch (error) {
        showToast(error.message || "Login gagal.", "error");
      } finally {
        setFormBusy(form, false);
      }
    }

        renderDaily(content);

        renderTasks(content);

      const select = document.getElementById("userPml");

      field.classList.toggle("hidden", !isPml);
      select.required = isPml;
      select.disabled = !isPml;
    }

    async function handleCreatePml(event) {
      event.preventDefault();
      await submitMutation(event.currentTarget, "createPml", formValues(event.currentTarget), "PML tersimpan.");
    }

    async function handleCreateUser(event) {
      event.preventDefault();
      await submitMutation(event.currentTarget, "createUser", formValues(event.currentTarget), "Akun tersimpan.");
    }

    function renderAccount(content) {
      content.innerHTML = `
        ${pageHead("Akun", "Ubah password login.", "")}
        <section class="panel" style="max-width:520px">
          <form id="passwordForm">
            <div class="grid">
              <div class="field">
                <label for="current_password">Password lama</label>
                <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
              </div>
              <div class="field">
                <label for="new_password">Password baru</label>
                <input id="new_password" name="new_password" type="password" minlength="6" autocomplete="new-password" required>
              </div>
            </div>
            <div class="actions" style="margin-top:16px">
              <button class="btn" type="submit">Ubah Password</button>
            </div>
          </form>
        </section>
      `;

      document.getElementById("passwordForm").addEventListener("submit", handleChangePassword);
    }

    async function handleChangePassword(event) {
      event.preventDefault();
      const form = event.currentTarget;

      await submitMutation(form, "changePassword", formValues(form), "Password diperbarui.", false);
      form.reset();
    }

    async function submitMutation(form, functionName, payload, successMessage, rerender = true) {
      setFormBusy(form, true);

      try {
        const response = await runServer(functionName, sessionToken, payload);

        if (response.data) {
          store = normalizeStore(response.data);
        }

        showToast(successMessage);

        if (rerender) {
          renderCurrentView();
        }
      } catch (error) {
        handleError(error);
      } finally {
        setFormBusy(form, false);
      }
    }

    async function deleteTask(id) {
      await runDelete("deleteTask", id, "Wilayah kerja dinonaktifkan.");
    }

    async function deletePetugas(id) {
      await runDelete("deletePetugas", id, "Petugas dinonaktifkan.");
    }

    async function deletePml(id) {
      await runDelete("deletePml", id, "PML dinonaktifkan.");
    }

    async function deleteDailyReport(id) {
      await runDelete("deleteDailyReport", id, "Laporan dinonaktifkan.");
    }

    async function deactivateUser(id) {
      await runDelete("deactivateUser", id, "Akun dinonaktifkan.");
    }

    async function runDelete(functionName, id, successMessage) {
      if (!confirm("Nonaktifkan data ini?")) {
        return;
      }

      try {
        const response = await runServer(functionName, sessionToken, id);

        if (response.data) {
          store = normalizeStore(response.data);
        }

        showToast(successMessage);
        renderCurrentView();
      } catch (error) {
        handleError(error);
      }
    }

    async function refreshData() {
      const button = document.getElementById("refreshButton");
      button.disabled = true;

      try {
        const response = await runServer("getBootstrapData", sessionToken);
        currentUser = response.user;
        store = normalizeStore(response.data);
        renderShell();
        showToast("Data diperbarui.");
      } catch (error) {
        handleError(error);
      } finally {
        button.disabled = false;
      }
    }

    async function handleLogout() {
      try {
        await runServer("logout", sessionToken);
      } catch (error) {
        // Logout lokal tetap dilanjutkan.
      }

      sessionStorage.removeItem("se2026_session_token");
      sessionToken = "";
      currentUser = null;
      store = emptyStore();
      renderLogin(false);
    }

    function renderTaskTable(tasks, withActions, filters) {
      if (!tasks.length) {
        return emptyState("Belum ada wilayah kerja.");
      }

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Kecamatan</th>
                <th>Desa</th>
                <th>SLS/RT</th>
                <th>PML</th>
                <th>Petugas</th>
                <th>Periode</th>
                <th>Target</th>
                <th>Tercacah</th>
                <th>Progress</th>
                ${withActions ? "<th>Aksi</th>" : ""}
              </tr>
            </thead>
            <tbody>
              ${tasks.map((task, index) => {
                const total = getTaskTotal(task.task_id, filters || {});
                const progress = getTaskProgress(task, filters || {});

                return `
                  <tr>
                    <td>${index + 1}</td>
                    <td>${escapeHtml(task.kecamatan)}</td>
                    <td>${escapeHtml(task.desa)}</td>
                    <td>${escapeHtml(task.sls)}</td>
                    <td>${escapeHtml(pmlName(task.pml_id))}</td>
                    <td>${escapeHtml(petugasName(task.petugas_id))}</td>
                    <td>${escapeHtml(task.mulai)} s.d. ${escapeHtml(task.selesai)}</td>
                    <td>${numberText(task.target)}</td>
                    <td>${numberText(total)}</td>
                    <td>${progressMarkup(progress)}</td>
                    ${withActions ? `<td><button class="btn danger" type="button" data-delete-task="${escapeHtml(task.task_id)}">Nonaktifkan</button></td>` : ""}
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderReportTable(reports, withActions) {
      if (!reports.length) {
        return emptyState("Belum ada laporan harian.");
      }

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Tanggal</th>
                <th>Wilayah</th>
                <th>PML</th>
                <th>Petugas</th>
                <th>Muatan</th>
                <th>Catatan</th>
                ${withActions ? "<th>Aksi</th>" : ""}
              </tr>
            </thead>
            <tbody>
              ${reports.map((report, index) => {
                const task = getTaskById(report.task_id);

                return `
                  <tr>
                    <td>${index + 1}</td>
                    <td>${escapeHtml(report.tanggal)}</td>
                    <td>${escapeHtml(task ? taskLabel(task) : "-")}</td>
                    <td>${escapeHtml(task ? pmlName(task.pml_id) : "-")}</td>
                    <td>${escapeHtml(task ? petugasName(task.petugas_id) : "-")}</td>
                    <td>${numberText(report.muatan_harian)}</td>
                    <td>${escapeHtml(report.catatan || "-")}</td>
                    ${withActions ? `<td><button class="btn danger" type="button" data-delete-report="${escapeHtml(report.report_id)}">Nonaktifkan</button></td>` : ""}
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderPetugasTable(petugas, withActions) {
      if (!petugas.length) {
        return emptyState("Belum ada petugas.");
      }

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Nama</th>
                <th>PML</th>
                <th>Telepon</th>
                ${withActions ? "<th>Aksi</th>" : ""}
              </tr>
            </thead>
            <tbody>
              ${petugas.map((item, index) => `
                <tr>
                  <td>${index + 1}</td>
                  <td>${escapeHtml(item.nama_petugas)}</td>
                  <td>${escapeHtml(pmlName(item.pml_id))}</td>
                  <td>${escapeHtml(item.telepon || "-")}</td>
                  ${withActions ? `<td><button class="btn danger" type="button" data-delete-petugas="${escapeHtml(item.petugas_id)}">Nonaktifkan</button></td>` : ""}
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderPmlTable(pml, withActions) {
      if (!pml.length) {
        return emptyState("Belum ada PML.");
      }

      return `
        <div class="table-wrap">
          <table style="min-width:560px">
            <thead>
              <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Telepon</th>
                ${withActions ? "<th>Aksi</th>" : ""}
              </tr>
            </thead>
            <tbody>
              ${pml.map((item, index) => `
                <tr>
                  <td>${index + 1}</td>
                  <td>${escapeHtml(item.nama_pml)}</td>
                  <td>${escapeHtml(item.telepon || "-")}</td>
                  ${withActions ? `<td><button class="btn danger" type="button" data-delete-pml="${escapeHtml(item.pml_id)}">Nonaktifkan</button></td>` : ""}
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderUserTable(users) {
      if (!users.length) {
        return emptyState("Belum ada akun.");
      }

      return `
        <div class="table-wrap">
          <table style="min-width:640px">
            <thead>
              <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Username</th>
                <th>Role</th>
                <th>PML</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody>
              ${users.map((user, index) => `
                <tr>
                  <td>${index + 1}</td>
                  <td>${escapeHtml(user.nama)}</td>
                  <td>${escapeHtml(user.username)}</td>
                  <td>${escapeHtml(user.role)}</td>
                  <td>${escapeHtml(user.pml_id ? pmlName(user.pml_id) : "-")}</td>
                  <td>
                    ${user.user_id === currentUser.user_id
                      ? `<span class="fine">Sedang login</span>`
                      : `<button class="btn danger" type="button" data-deactivate-user="${escapeHtml(user.user_id)}">Nonaktifkan</button>`
                    }
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderChart(tasks, filters) {
      const canvas = document.getElementById("progressChart");

      if (!canvas || typeof Chart === "undefined") {
        return;
      }

      const dailyMap = {};
      const taskIds = {};

      tasks.forEach((task) => {
        taskIds[task.task_id] = true;
      });

      store.reports.forEach((report) => {
        if (!taskIds[report.task_id]) {
          return;
        }

        if (filters.tanggal && report.tanggal !== filters.tanggal) {
          return;
        }

        dailyMap[report.tanggal] = (dailyMap[report.tanggal] || 0) + asNumber(report.muatan_harian);
      });

      const labels = Object.keys(dailyMap).sort();
      const values = labels.map((date) => dailyMap[date]);

      progressChart = new Chart(canvas, {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "Muatan harian",
            data: values,
            borderColor: "#dd620a",
            backgroundColor: "rgba(221, 98, 10, 0.18)",
            tension: 0.28,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true
            }
          },
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    }

    function getFilteredTasks(filters) {
      return store.tasks.filter((task) => {
        const matchPml = !filters.pml_id || task.pml_id === filters.pml_id;
        const matchPetugas = !filters.petugas_id || task.petugas_id === filters.petugas_id;

        if (!matchPml || !matchPetugas) {
          return false;
        }

        if (filters.tanggal) {
          return store.reports.some((report) => report.task_id === task.task_id && report.tanggal === filters.tanggal);
        }

        return true;
      });
    }

    function getVisibleReports(filters) {
      const visibleTaskIds = {};

      getFilteredTasks(filters).forEach((task) => {
        visibleTaskIds[task.task_id] = true;
      });

      return store.reports
        .filter((report) => visibleTaskIds[report.task_id])
        .filter((report) => !filters.tanggal || report.tanggal === filters.tanggal)
        .sort((a, b) => String(b.tanggal).localeCompare(String(a.tanggal)) || String(b.created_at).localeCompare(String(a.created_at)));
    }

    function getTaskReports(taskId, filters) {
      return store.reports.filter((report) => {
        return report.task_id === taskId && (!filters.tanggal || report.tanggal === filters.tanggal);
      });
    }

    function getTaskTotal(taskId, filters) {
      return getTaskReports(taskId, filters || {}).reduce((sum, report) => sum + asNumber(report.muatan_harian), 0);
    }

    function getTaskProgress(task, filters) {
      const target = asNumber(task.target);

      if (target <= 0) {
        return 0;
      }

      return Math.min(100, Math.round((getTaskTotal(task.task_id, filters || {}) / target) * 100));
    }

    function getSummary(tasks, filters) {
      const totalTarget = tasks.reduce((sum, task) => sum + asNumber(task.target), 0);
      const totalTercacah = tasks.reduce((sum, task) => sum + getTaskTotal(task.task_id, filters), 0);
      const sisa = Math.max(totalTarget - totalTercacah, 0);
      const progress = totalTarget <= 0 ? 0 : Math.round((totalTercacah / totalTarget) * 100);

      return {
        totalTarget,
        totalTercacah,
        sisa,
        progress
      };
    }

    function getPetugasForFilter(pmlId) {
      return store.petugas.filter((petugas) => !pmlId || petugas.pml_id === pmlId);
    }

    function getTaskById(taskId) {
      return store.tasks.find((task) => task.task_id === taskId);
    }

    function pmlName(pmlId) {
      const pml = store.pml.find((item) => item.pml_id === pmlId);
      return pml ? pml.nama_pml : "-";
    }

    function petugasName(petugasId) {
      const petugas = store.petugas.find((item) => item.petugas_id === petugasId);
      return petugas ? petugas.nama_petugas : "-";
    }

    function petugasLabel(petugas) {
      return isAdmin()
        ? `${petugas.nama_petugas} (${pmlName(petugas.pml_id)})`
        : petugas.nama_petugas;
    }

    function taskLabel(task) {
      return `${task.kecamatan} - ${task.desa} - ${task.sls}`;
    }

    function metric(label, value) {
      return `
        <div class="metric">
          <span class="fine">${escapeHtml(label)}</span>
          <strong>${escapeHtml(value)}</strong>
          <span class="muted">Aktif</span>
        </div>
      `;
    }

    function summaryRow(label, value) {
      return `
        <div class="summary-row">
          <span>${escapeHtml(label)}</span>
          <strong>${escapeHtml(value)}</strong>
        </div>
      `;
    }

    function progressMarkup(progress) {
      return `
        <div class="progress">
          <div class="progress-track">
            <div class="progress-fill" style="width:${progress}%"></div>
          </div>
          <span class="fine">${progress}%</span>
        </div>
      `;
    }

    function footerMarkup() {
      return `
        <footer class="app-footer">
          Webmon v1.2. Tim IPDS BPS Kab Kep Anambas. CP perubahan atau saran:
          <a href="mailto:rafirizha@bps.go.id">rafirizha@bps.go.id</a>
        </footer>
      `;
    }

    function logoMarkup() {
      return `
        <div class="brand-mark">
          <img src="${WEBMON_LOGO_SRC}" alt="Logo Webmon">
        </div>
      `;
    }

    function pageHead(title, subtitle, actions) {
      return `
        <header class="page-head">
          <div class="page-title">
            <h1>${escapeHtml(title)}</h1>
            <p class="muted">${escapeHtml(subtitle)}</p>
          </div>
          <div class="actions">${actions || ""}</div>
        </header>
      `;
    }

    function emptyState(message) {
      return `<div class="empty">${escapeHtml(message)}</div>`;
    }

    function option(value, label, selectedValue) {
      const selected = selectedValue !== undefined && String(value) === String(selectedValue)
        ? "selected"
        : "";

      return `<option value="${escapeHtml(value)}" ${selected}>${escapeHtml(label)}</option>`;
    }

    function formValues(form) {
      const payload = {};
      const data = new FormData(form);

      data.forEach((value, key) => {
        payload[key] = value;
      });

      return payload;
    }

    function setFormBusy(form, busy) {
      form.querySelectorAll("button, input, select, textarea").forEach((field) => {
        field.disabled = busy;
      });
    }

    function attachDeleteHandlers(attribute, handler) {
      document.querySelectorAll(`[data-${attribute}]`).forEach((button) => {
        button.addEventListener("click", () => handler(button.dataset[toDatasetKey(attribute)]));
      });
    }

    function toDatasetKey(attribute) {
      return attribute.replace(/-([a-z])/g, (_, letter) => letter.toUpperCase());
    }

    function normalizeStore(data) {
      return {
        pml: (data && data.pml) || [],
        petugas: (data && data.petugas) || [],
        tasks: (data && data.tasks) || [],
        reports: (data && data.reports) || [],
        users: (data && data.users) || []
      };
    }

    function emptyStore() {
      return {
        pml: [],
        petugas: [],
        tasks: [],
        reports: [],
        users: []
      };
    }

    function isAdmin() {
      return currentUser && currentUser.role === "admin";
    }

    function asNumber(value) {
      const number = Number(value);
      return isFinite(number) ? number : 0;
    }

    function numberText(value) {
      return asNumber(value).toLocaleString("id-ID");
    }

    function escapeHtml(value) {
      return String(value === undefined || value === null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function destroyChart() {
      if (progressChart) {
        progressChart.destroy();
        progressChart = null;
      }
    }

    function showToast(message, type) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = `toast show ${type === "error" ? "error" : ""}`;

      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        toast.className = "toast";
      }, 3600);
    }

    function handleError(error) {
      const message = error && error.message ? error.message : "Terjadi kesalahan.";
      showToast(message, "error");

      if (message.toLowerCase().includes("sesi")) {
        sessionStorage.removeItem("se2026_session_token");
        sessionToken = "";
        renderLogin(false);
      }
    }

    function runServer(functionName, ...args) {
      return new Promise((resolve, reject) => {
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((error) => {
            reject(new Error(error && error.message ? error.message : String(error)));
          });

        runner[functionName](...args);
      });
    }
  </script>
</body>
</html>
